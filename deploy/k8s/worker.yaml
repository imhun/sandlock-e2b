apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  # The headless Service (bottom of this file) is the StatefulSet's identity anchor:
  # it is what turns the stable pod names below into per-pod DNS records
  # (`e2b-worker-0.worker-headless.…`). Nothing *addresses* the workers by DNS -- the
  # control plane dials their pod IPs -- but the reference is required, and with a
  # StatefulSet the records are finally per-pod and stable (under a Deployment the
  # same Service gave no stable name at all, see the E2.4 finding in §10.3).
  serviceName: worker-headless
  # Two replicas: the shape the compose stack runs (worker-1 + worker-2) and the
  # one verified on a real cluster once N13 closed (docs/k8s-deployment.md §13).
  # More than one worker over one shared workspace base is safe because a
  # reconciling worker asks the control plane for the *fleet-wide* sandbox set
  # before it deletes anything: it removes only what nobody owns and leaves the
  # rest (`protected_elsewhere`), and it defers the whole disk sweep when that
  # fleet view cannot be established. Measured: a restarted worker saw all four
  # live trees as unowned, protected all four, and deleted none.
  # ⚠ The storage must provide locks that reach across nodes -- NFSv4 (or any
  # server-side locking), NOT NFSv3 with `nolock`, whose locks are single-node
  # only. The uid pool's flock on `<base>/.uid_pool.lock` is what keeps two
  # replicas from handing out the same host uid (docs/k8s-deployment.md §10.3 F5).
  replicas: 2
  # The StatefulSet (not a Deployment) is the fix for N20: a worker's node id is its
  # pod name (downward API `metadata.name`), and a Deployment hands every restart a
  # brand-new name. The control plane then kept the *previous* incarnation's sandbox
  # records -- unroutable until they aged out (`Node unavailable`) -- and the old
  # record lingered as a zombie node. Stable ordinals remove the whole class, and they
  # are what the compose stack has always had (`E2B_NODE_ID: worker-1` / `worker-2`).
  # A restart with the same id re-registers, the recovery round reports the sandboxes
  # the control plane still attributes to this worker (`remaining = local & known`, so
  # it can never claim a peer's), and their records and trees survive.
  #
  # `podManagementPolicy: Parallel` because the replicas are interchangeable: the
  # default OrderedReady would serialize startup and rollouts behind pod 0.
  podManagementPolicy: Parallel
  # StatefulSet updates are delete-then-create, one pod at a time (reverse ordinal),
  # so there is no surge pod to schedule. That is also what the old `maxSurge: 0` was
  # for: this workload declares no `requests`, so Kubernetes copies the 2-CPU limit
  # into the request and a second pod cannot fit on a 4-core node -- measured
  # 2026-09-17 on k0s, where a Deployment rollout stalled with
  # `0/2 nodes are available: 1 Insufficient cpu`.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: e2b-worker
  template:
    metadata:
      labels:
        app: e2b-worker
    spec:
      # A6/fix-1: the worker image builds with `USER 65534:65534`
      # (deploy/docker/Dockerfile.envd) and this pod runs the same identity --
      # but it now **pins it explicitly** on the worker container (Task 4
      # slice B). That is not a restatement: the control plane's trusted source
      # for the worker's own uid/gid reads the pod's `securityContext` through
      # the pod API, and a pod spec that pins nothing reads as "unknown" (no
      # identity stored, every identity-needing file op a named 503). The image
      # `USER` alone is invisible to that lookup.
      #
      # There is no capability declaration any more either: the privileged
      # hand-over moved off this pod entirely (C1 put chown/rm/walk in the
      # per-node broker; C3 Task 4 gave the same verbs to the agent), and the
      # image's file-capability binaries are gone, so the container's bounding
      # set is the empty set.
      #
      # No `securityContext.sysctls` any more (N5, 2026-09-17). The pod-level
      # `net.ipv4.ip_unprivileged_port_start=0` window existed for exactly one
      # user: the wildcard-allowOut DNS gateway binding :53, which used to bind
      # in the shared pod netns as uid 65534 with no effective capability. With
      # per-sandbox netns the bind happens inside the sandbox's own netns, where
      # the guest's root-in-userns holds CAP_NET_BIND_SERVICE -- the same reason
      # the compose stack dropped its copy on 2026-09-16. Deleting the block
      # also removes a pod-level hole that had nothing to do with sandboxes:
      # every process in this pod could bind low ports.
      terminationGracePeriodSeconds: 120
      # C1 (wave 2): the one init this pod still needs -- and it is *not* root.
      #
      # The two owner inits that used to live here (image-cache-init,
      # workspace-root-init) moved to the per-node root DaemonSet in wave 2 --
      # C1's `e2b-priv-broker`, whose owner inits now live in
      # `deploy/k8s/c3-agent.yaml`'s face B, because this pod is not allowed a
      # root container of any kind.
      #
      # C3 Task 7 retired C1's broker, and with it the `wait-for-broker`
      # ordering gate that used to sit here: that gate belonged to the
      # `socket` rollback shape (a worker that started before the per-node
      # daemon would refuse to start, so it waited for a successful `hello`
      # round-trip). There is no socket transport any more -- the worker runs
      # `E2B_PRIV_HELPER_TRANSPORT=agent` and the agent DaemonSet is waited on
      # by `deploy/k8s-k0s/apply.sh` *before* this StatefulSet rolls -- so this
      # pod now has **no** init container at all.
      containers:
        - name: worker
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          ports:
            - containerPort: 49983
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The address the control-plane dials back on. This must NOT be
            # `http://$(POD_NAME).worker-headless.<ns>.svc.cluster.local:49983`
            # (what docs/SCALING.md §8.1 proposed, carried over from the compose
            # shape where `http://worker-1:49983` works because Docker's embedded
            # DNS resolves container names): a per-pod name under a headless
            # Service only exists when the endpoint carries a hostname, and that
            # comes from `pod.spec.hostname` -- which a Deployment never sets.
            # Measured 2026-09-17 on k0s 1.36: the EndpointSlice endpoint had no
            # hostname, the FQDN did not resolve, and every `Sandbox.create()`
            # failed with `502: Node ... unavailable: [Errno -2] Name or service
            # not known`. The pod IP is the address that always exists; the pod
            # re-registers on restart, which updates it.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: E2B_NODE_ADDRESS
              value: http://$(POD_IP):49983
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEY
            # O3 Task 3: the internal key's rotation window (E3.6). The worker's
            # gateway and agent accept every key in this list, which is what lets
            # a rotation put the new key in the slot above while the old one is
            # still accepted here -- no worker has to be restarted before the
            # control plane's new key is in use. `optional: true`: outside a
            # window the key is absent from the Secret, and a required ref would
            # leave the pod in CreateContainerConfigError.
            - name: E2B_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEYS
                  optional: true
            # N49 step ①: this worker's **own** node-bound credential, the map
            # `{"<key>": "<node_id>"}` the Secret carries (secrets.sh generates
            # one per node). With it the control plane derives "who is calling"
            # from the credential instead of leaning on the source IP alone.
            # `optional: true` keeps an older Secret (or a lane that ships no
            # map -- compose, tests) starting: the worker then presents the
            # fleet key above, exactly as today.
            - name: E2B_INTERNAL_NODE_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_NODE_KEYS
                  optional: true
            # N57 / Task 3: the sandbox **trees** live on the node's own disk
            # (`/var/lib/e2b/workspaces`, the hostPath below), not on the
            # shared NAS. The premise is measured, not assumed, and it is two
            # lines that must be read together
            # (`docs/create-local-first-design.md` §1.1/§1.2):
            #
            #   * metadata -- 200 x 64 B files: **0.027 ms/file local vs
            #     13.136 ms/file on the NAS (475x)**. A developer workload
            #     (`npm install`: tens of thousands of create/write/close) is
            #     the product this buys;
            #   * large sequential bytes -- **124.9-125.5 MB/s local vs
            #     483-493 MB/s NAS (local is ~3.9x slower)**. The flip is a
            #     *trade*, not a win on every axis, and Task 1 retracted the old
            #     "local 1027 MB/s" reading (it was a burst phase).
            #
            # The platform's own namespaces (`_snapshots`, `_migrate`,
            # `_volumes`, `_images`) deliberately stay on the shared root
            # (`E2B_SHARED_VOLUME_ROOT` below): their readers are other nodes
            # and the other control-plane replica, and the capacity account
            # (§2.3) says the snapshot store cannot live on a node's disk at
            # all. The judge for every migration path is `E2B_TREES_SHARED`,
            # which the **control plane** names (it is the only reader); it is
            # `0` in `control-plane.yaml`.
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b/workspaces
            # N27: the platform's own files (the runtime records, the command
            # logs, the checkpoint images) live under a base of their own, a
            # **sibling** of the sunk tree root and on the same mount. (Its
            # node-local half -- the marker, the accounting seed, `.route-b` and
            # the uid pool's own files -- moved to `E2B_NODE_STATE_BASE` below
            # in N57 / Task 4.) Both halves matter:
            # `rename(2)` stops at a mount point, so a second mount would make
            # every migration an EXDEV, and "platform state is not on the path a
            # sandbox reaches from its own tree" only holds if the state base is
            # not *under* `E2B_WORKSPACE_BASE` (see the overlay test that pins
            # exactly that). Unset -- what every other deployment does today --
            # both bases are one directory and the layout is byte-for-byte the
            # pre-N27 one.
            - name: E2B_STATE_BASE
              value: /var/lib/e2b-sandboxes/state
            # N57 (Task 4): the **node-local** half of the platform's own
            # state -- the create's `.creating` marker, its `statfs(2)`
            # accounting seed and `.route-b`'s slot documents. All three are
            # read by *this* node's processes only (the marker by a racing
            # DELETE, the seed by the sandbox's own slot, the slot documents by
            # the slot and the agent), while the *record*
            # (`<state>/_runtime/<id>/sandbox.json`) and the checkpoint images
            # stay on the shared base because the fleet-wide uid ledger and a
            # migrating resume read them from other nodes. The uid pool's own
            # `.uid_pool.lock` / `.uid_reservations/` are **not** here either:
            # N57 moved them back to the shared `E2B_STATE_BASE` so `acquire`'s
            # read-record / pick-uid / write-marker critical section is mutually
            # exclusive across nodes (the `claim` path -- the factory shape --
            # never touches them).
            #
            # The point of the split is the create's `prepare` phase: on this
            # deployment every write under `<state>` is one NFS metadata round
            # trip (~13 ms measured), and `prepare` was paying it for each of
            # these chips. A hostPath on the node's own disk (the same disk as
            # `E2B_IMAGE_CACHE_DIR`) costs microseconds -- and a large-block
            # write, where the local disk is the slower medium, never happens
            # here: these are all tiny files.
            #
            # Unset -- what every other deployment does today -- is byte for
            # byte the pre-Task-4 layout (the chips live under the state base).
            - name: E2B_NODE_STATE_BASE
              value: /var/lib/e2b/state
            # N27: name the export root as the third root the privileged
            # helpers/broker may touch. It used to be covered *by accident*
            # (the workspace base was the export root); now that the tree root
            # sinks under it, `_volumes` and `_images` would fall outside the
            # set of roots the privileged side acts on unless this is set --
            # and `_chown_path()` falls back to an in-process `os.chown` for a
            # path nobody else can reach, which this pod's 65534 worker cannot
            # do (EPERM, silent per-volume degradation). C1 (wave 2) made that
            # the live shape: the worker is no longer root and its file steps
            # are performed elsewhere (C1: the broker over `socket`, retired by
            # C3 Task 7; C3 Task 4 slice B onward: the per-node agent, over the
            # CP's `agent` shape), so the roots the agent is willing to act
            # under are what decide whether a chown can happen at all. The two
            # readers that care on this side are the A5 startup probe (warning
            # only) and `build_volume_mounts`' "volume hostPath must be under
            # the shared root" check -- the CP derives every volume path from
            # the same export root, so it holds by construction.
            - name: E2B_SHARED_VOLUME_ROOT
              value: /var/lib/e2b-sandboxes
            # Track Z / Z-F7: the extracted image rootfs cache goes on the same
            # RWX PVC as the workspaces, not inside the pod. The k8s shape has
            # the same gap the compose stack had: the default is the *relative*
            # ``tmp/sandboxes/_images``, so every pod restart (and every
            # rescheduled replica) threw the whole cache away and each replica
            # kept a private copy. ``_images`` is a reserved platform namespace
            # (gateway_common/paths.py), so the sandbox scans and the quota
            # scan skip it -- and since this manifest set ships no quota-agent
            # (§2.4.4, W4), the resolver's own cap is the ONLY bound the cache
            # has here; it must stay set (docs/production-deployment-requirements.md §2.7).
            - name: E2B_IMAGE_CACHE_DIR
              value: /var/lib/e2b-images
            # ...and the OCI layout tars stay on the *shared* volume, because the
            # control plane is what exports them (``Template.build`` writes
            # ``<dir>/_oci/<slug>.oci.tar``) and every worker has to be able to
            # read one built on another node. Splitting the two directories is
            # what keeps the unpack local: the same 2111-file python-slim rootfs
            # takes 61.4s onto the shared Aliyun NAS and 0.26s onto a node's own
            # disk (measured 2026-09-17), and the unpack runs while the sandbox's
            # first command waits. See docs/task-backlog.md N18.
            - name: E2B_IMAGE_OCI_DIR
              value: /var/lib/e2b-sandboxes/_images
            - name: E2B_IMAGE_CACHE_MAX_BYTES
              value: "4294967296"
            - name: E2B_IMAGE_CACHE_EVICT_MIN_AGE_S
              value: "300"
            # Task 3: one tree copy's byte cap, shared by every component that
            # moves a tree (this worker's migration export/import and snapshot
            # payloads, the control plane's pass-through copy, face B's
            # materialization). `0` = unlimited; the default is one sandbox's
            # disk quota (1 GiB), because a cap below a legitimate sandbox's
            # own size would refuse the restore the product sells
            # (`docs/create-local-first-design.md` §3.1). Over it the answer is
            # the named refusal `tree-copy-too-large` (413), never a truncated
            # tree.
            - name: E2B_TREE_COPY_MAX_BYTES
              value: "1342177280"
            - name: E2B_TREE_COPY_WINDOW_BYTES
              value: "67108864"
            # The cache is written by two uids (the control-plane pod runs as
            # root, this pod as 65534), so the resolver hands every directory
            # and file it creates to the worker uid: the worker writes as the
            # owner, root writes through CAP_DAC_OVERRIDE, and a sandbox uid
            # (10000+) gets read/traverse bits only -- never 0777, since a
            # writable rootfs cache is a cross-tenant poisoning vector.
            # docs/production-deployment-requirements.md §2.7.1.
            - name: E2B_IMAGE_CACHE_OWNER_UID
              value: "65534"
            # Route B's scratch root (the per-slot policy/program documents).
            # N57 (Task 4) puts it under the **node-local** state base: the
            # writer is this worker, the reader is this node's slot, and the
            # only other process that touches a document is this node's agent
            # (which scopes it to the slot's uid, 0440). Before Task 4 it sat
            # under the shared state base, where slot start/stop paid an NFS
            # round trip per document for no cross-node reader at all. The per-node
            # agent only touches roots this deployment names (N52 retired the
            # worker-side broker whose whitelist this used to be) -- so the
            # value has to stay under `E2B_NODE_STATE_BASE` above; anywhere
            # else the document could only fall back to a world-readable 0444
            # one carrying the egress-proxy credentials.
            #
            # The **control plane** spells this value too (it derives
            # `scope-slot-document`'s path; the worker may not report one), so
            # `deploy/k8s/control-plane.yaml` has to carry the same string --
            # `tests/unit/test_c3_agent_manifest.py` pins the two together.
            - name: E2B_ROUTE_B_TMP_ROOT
              value: /var/lib/e2b/state/.route-b
            # C3 (Task 4 slice B): **the agent shape** -- this worker holds no
            # privileged binary at all (the image ships no `/var/lib/e2b-priv/`)
            # and `agent` is what routes every file step to the control plane
            # (`{sandbox_id, op}`), which instructs this node's agent.
            #
            # C3 Task 7 retired the socket-era rollback lever
            # (`E2B_PRIV_HELPER_TRANSPORT=socket` + its `E2B_PRIV_HELPER_SOCKET`
            # path) together with the broker DaemonSet; N52 (2026-09-30) retired
            # the `exec` shape too. `agent` is the only value the code accepts
            # (`auto` resolves to it); naming a retired one is a startup
            # refusal by name, not a silent downgrade.
            - name: E2B_PRIV_HELPER_TRANSPORT
              value: agent
            # C3 (Task 3): route B's slot identity now comes from the per-node
            # agent, not from a file-capability binary in this image.
            #
            # The worker forks the slot, lets it `unshare` a user namespace and
            # reports `{sandbox_id, pid}` to the **control plane** (never to the
            # agent: `worker <-> agent` does not exist, hard rule 5); the CP
            # checks the report against its own records and instructs the agent
            # with the uid. The child then polls `setresuid(X)` and execs the
            # supervisor -- there is no "go ahead" step, and this pod still
            # holds no capability (its `CapEff` is 0).
            #
            # `spawn` (the worker performing the setuid itself, or its
            # file-capability spawner doing it) is **gone** (2026-09-30,
            # open-issues N52): `agent-grant` is the only mode the code accepts
            # and every shipped manifest names it. The old starter -- and the
            # `e2b-slot-spawn` binary it needed -- live in git if a deployment
            # ever needs that shape back.
            #
            # ⚠ Do **not** give this pod `hostPID`. The agent's reverse lookup
            # discriminates two workers on one node by the slot child's `NSpid`
            # chain, and a host-pid namespace collapses that chain to one entry
            # -- the lookup would refuse every grant while the manifest still
            # looked correct.
            - name: E2B_SLOT_IDENTITY
              value: agent-grant
            # N5/N10 closed (2026-09-17): this manifest now runs the same
            # per-sandbox namespace shape the compose stack has run in
            # production since 2026-09-16.
            #   E2B_PID_NS                 -- per-sandbox pid namespace. Without
            #     it a sandbox sees the pod's pids and `kill(pid, 0)` answers
            #     EPERM for a live one (existence oracle).
            #   E2B_ENABLE_NET_ISOLATION + E2B_FD_INJECT_CONNECT -- per-sandbox
            #     loopback netns; the pair is mandatory (`create_app` refuses
            #     net_isolation without fd_inject_connect, precisely because the
            #     single-switch shape is a sandbox with no network at all).
            # Neither adds a kernel prerequisite this pod did not already have:
            # per-sandbox host uids (E2B_PER_SANDBOX_UID, on by default) already
            # create a user namespace per sandbox, which is the same
            # `unshare(CLONE_NEWUSER)` these two build on.
            - name: E2B_PID_NS
              value: "true"
            - name: E2B_ENABLE_NET_ISOLATION
              value: "true"
            - name: E2B_FD_INJECT_CONNECT
              value: "true"
            # N42 (2026-09-26): the egress switch, which this manifest never
            # declared. `envd_service/executors/sandlock.py` gates every net
            # rule on `self._allow_internet_access and self._enable_network`
            # and the envd default is `false`, so until now a create request
            # with `allowInternetAccess=True` was accepted and ignored: the
            # sandbox got no allow rules and no DNS gateway at all (measured on
            # the live cluster 2026-09-26: `1.1.1.1:443` ->
            # `PermissionError [Errno 13]`, `pypi.org:443` -> `gaierror
            # [Errno -3]`; docs/open-issues.md N42). The user ruling is egress
            # on everywhere, and the value is the fleet's (the two compose
            # stacks) -- "on" means a sandbox egresses exactly where its own
            # request allows it, not a blanket hole: a request that carries no
            # `network` still gets only the fixed domain set.
            - name: E2B_ENABLE_NETWORK
              value: "true"
            # N35: let a sandbox build its own root (mount namespace, the
            # image rootfs bound in as `/`, `pivot_root`, then drop
            # CAP_SYS_ADMIN) instead of having the mediator rewrite every path
            # the emulated root would have produced. What it buys is the class
            # of things the *kernel* resolves by itself and the emulation can
            # only refuse: `#!` scripts (including every console script a
            # `pip install --user` leaves in `~/.local/bin`), static ELF,
            # binfmt handlers, `$0`/`sys.path[0]`, `mountinfo`.
            #
            # Prerequisite, and the reason this is spelled out here rather
            # than left to the operator: the *node's* worker seccomp profile
            # has to admit `mount`/`umount2`/`pivot_root` BEFORE the worker
            # that reads this rolls. deploy/k8s/seccomp-installer.yaml ships
            # that profile and must be applied first -- a node still on the
            # old one refuses every Sandbox.create with EPERM. The worker now
            # says so itself instead of leaving it to be rediscovered: it
            # probes the whole sequence in a subprocess the first time it
            # builds an executor and raises with the failing step and the
            # file to apply (envd_service/executors/sandlock.py).
            #
            # Measured 2026-09-25 on the self-hosted k0s fleet, both workers,
            # with the profile above applied first: a shebang script written
            # into /workspace and executed in the same command returns its
            # own output (rc=0); the same command on a worker that still ran
            # the previous manifest fails with `Permission denied` (rc=126),
            # which is the shape N35 exists to remove.
            #
            # The workload gains nothing: `mount`/`unshare`/`chroot` stay
            # refused for it by the fork's own filter and by the dropped
            # capability (docs/chroot-workspace-exec.md §9).
            - name: E2B_REAL_ROOT
              value: "1"
            # S3 (`docs/checkpoint-restore-e2b-half.md`): a pause writes a
            # checkpoint image *before* it freezes, so the sandbox's **process**
            # outlives this pod, and a resume either thaws the session that is
            # still here or resumes the image that is not. What it needs is a
            # wheel whose `sandlock-supervise` knows the `checkpoint`/`restore`
            # verbs (fork `57f610c`); a worker on an older one is told
            # `unknown verb`, logs it, and keeps freezing in place as before --
            # a capture that cannot happen never fails a pause.
            #
            # The images are the **deployment's** disk, not the sandbox's: they
            # live in `<base>/_runtime/<id>/checkpoint/` (0700, worker uid; the
            # sandbox cannot read them at all) and are billed to
            # `E2B_PLATFORM_DISK_MB`, never to a sandbox's `diskMB`. Billing a
            # pause to the paused sandbox would take its writes away with the
            # very call that was supposed to free the node (the write side of
            # that budget is `RLIMIT_FSIZE=0` plus `ENOSPC` on creates), while
            # none of its own files changed.
            #
            # 0 would mean unlimited -- the hole this account exists to close --
            # so the budget is stated here instead of left implicit. An image is
            # the sandbox's memory, i.e. tens to a few hundred MiB in the 512
            # MiB production shape, so 8 GiB holds a few dozen paused sandboxes;
            # a capture that would not fit is refused and removed, and the
            # sandbox stays paused in place rather than quietly growing.
            - name: E2B_PAUSE_CHECKPOINT
              value: "1"
            - name: E2B_PLATFORM_DISK_MB
              value: "8192"
            # FUP-30's diagnostic: with this on, the fork prints one line per
            # restore step to the *slot's* stderr (`checkpoint::resume::note`),
            # and the worker logs that tail right after a restore
            # (`envd_service/executors/sandlock.py::_log_slot_stderr`). A
            # restored child has no stdio of its own -- a session gives it
            # /dev/null -- so this is the only way "the engine announced a child
            # and the process is gone a second later" can say *how far it got*.
            # ~6 lines per restore, i.e. only when a sandbox actually resumes;
            # leave it on until that incident is closed.
            - name: SANLOCK_RESTORE_TRACE
              value: "1"
            # Still *not* set: E2B_UID_POOL_START/SIZE. The allocator is
            # cross-process safe on a shared base (`uid_pool.acquire` takes an
            # flock on `<base>/.uid_pool.lock` and recomputes the free set from
            # every `sandbox.json` plus the reservation markers, so two pods
            # sharing this PVC do not hand out the same uid). The *multi-replica*
            # shape as a whole is now verified (N13 closed 2026-09-17, see
            # docs/k8s-deployment.md §13), so no per-pod segments are needed --
            # but the flock above is only real if the storage's locks cross
            # nodes (NFSv4; NFSv3 + `nolock` is single-node only).
            #
            # ⚠ 改池（在这里补上 E2B_UID_POOL_START/SIZE，或改代码默认）必须**同时**改
            # agent 的面 B（deploy/k8s/c3-agent.yaml）：池是面 B 白名单校验的一部分，
            # 两侧不一致时被拒的动作会点名（C1 时代那份 broker DaemonSet 已由 C3
            # Task 7 退役，同一个"两侧同源"的要求现在落在 agent 上）。
            - name: E2B_BASE_IMAGE
              # Keep in step with control-plane.yaml (same digest-pinned ACR
              # mirror; Docker Hub is unreachable from the deployment hosts).
              value: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
            - name: E2B_TEMPLATE_IMAGES
              value: '{"py311": "registry.cn-shanghai.aliyuncs.com/byteplan/python:3.11-slim"}'
            - name: E2B_NODE_MEMORY_MB
              value: "2048"
            - name: E2B_NODE_CPU_PERCENT
              value: "200"
            - name: E2B_NODE_DISK_MB
              value: "4096"
            # N25/L2b + N28/D: how often this worker rewalks each sandbox tree
            # and reports the measured bytes on its heartbeat. 0 disables the
            # report entirely -- and with it the only thing that catches a
            # sandbox writing *past* its sold budget (the admission ledger
            # bounds what was sold, not what exists), so leave it on.
            #
            # 5 s = the heartbeat's own cadence, which is the floor for *this*
            # path: a report is acted on at the next pulse, so a faster walk
            # would only make the number fresher than the moment it is read.
            # The walk itself runs on a worker thread, so a short interval
            # cannot stall the heartbeat or the file API -- it costs NAS reads
            # (measured: ~2.4 ms per directory, ~3.5 us per file) and, while
            # the walk is still whole-tree, staleness is
            # `interval x ceil(trees / trees-per-round)` because one round gets
            # a 1 s budget.
            #
            # The measured number is not only the pause trigger: the control
            # plane stores it on the sandbox record, where it is what
            # `GET /sandboxes/{id}/metrics` answers as `diskUsed` and what a
            # platform-initiated pause quotes back ("its workspace grew past
            # its budget (1340 MiB used of 1024 MiB)").
            #
            # Cost was measured, not assumed (docs/disk-accounting-dirty-dirs.md
            # §5.2): ~3.5 us/file and ~2.4 ms/directory on this NAS, and a
            # round stops at a 1 s budget and resumes where it left off.
            - name: E2B_DISK_ENFORCE_INTERVAL_S
              value: "1"
            # N25/L2c: build the report from each sandbox's *mediator* instead
            # of walking every tree. The mediator sees every write the sandbox
            # makes (it already resolves every path), so it can say which
            # directories changed; the worker re-walks only those.
            #
            # The two implementations must produce the same number, and that
            # is measured rather than assumed: `tmp/k0s/probe_dir_ledger.py`
            # compares the metric against a byte-exact measurement taken
            # *inside* the sandbox after a mutation sequence, and the worker
            # logs how each round was answered
            # (`disk accounting: ledger=… rebuilt=… walk=…`) so an inert
            # feature cannot look like a working one.
            #
            # Falling back is always safe and always allowed: no live session,
            # an older wheel without the drain verb, the pure shape (no path
            # notifications), a dirty set that overflowed, or an unreadable
            # directory all end in the whole-tree walk.
            - name: E2B_DISK_ENFORCE_DIRTY
              value: "0"
            # N25/L2c, the two bounds that make the incremental answer safe:
            #
            #   GRACE  -- a directory that was written keeps being re-checked
            #     this long. The mediator marks a write at its *path* syscall,
            #     so a process that opens a file and appends later (a log) emits
            #     nothing after the open; measured on this fleet: open, 1000
            #     bytes, a 12 s sleep, 5000 more bytes -- and the second write
            #     was invisible until this window existed.
            #   RECONCILE -- how long the incremental answer may go before the
            #     accounting is rebuilt from a real walk. This is what catches
            #     everything the mediator structurally cannot see (a descriptor
            #     held open longer than the grace window, a write from another
            #     trust domain). 0 disables the backstop; do not.
            - name: E2B_DISK_DIRTY_GRACE_S
              value: "120"
            - name: E2B_DISK_RECONCILE_INTERVAL_S
              value: "900"
            # N25/C: hand every command a per-exec `RLIMIT_FSIZE` equal to what
            # is **left** of its workspace budget, refreshed at each exec (the
            # dirty-directory ledger makes that refresh milliseconds, so it is
            # not a stale number from the last scan round).
            #
            # What it buys: a sandbox at 700 of 1024 MiB can no longer write
            # another 1024 MiB file -- the write stops at 324. Consecutive
            # writes that are each their own exec (every SDK `files.write`, and
            # every upload helper) therefore converge on the budget instead of
            # each re-reading the full one.
            #
            # What it does not buy on its own: a *single* command that loops and
            # writes files (`for i in 1 2 3; do dd ...; done`) is one process
            # with one ceiling per file. That gap is closed in the fork: the
            # mediator hands each `open` `baseline + what is left` from its own
            # spend counter (§22.5.9), so a second file sees what the first one
            # used, however fast the files come.
            #
            # Over budget the ceiling is **zero**, and that is the product
            # semantic rather than a freeze: the sandbox may not write (every
            # write fails with EFBIG) and may not create new entries (the
            # mediator refuses `O_CREAT`/`mkdir`/`symlink`/`link` with ENOSPC),
            # while reads, exec and -- above all -- the deletes that bring it
            # back inside keep working. There is deliberately no floor: a floor
            # is the one MiB that steps a full sandbox past its budget, and the
            # control plane used to freeze it for exactly that.
            - name: E2B_DISK_EXEC_LIMIT
              value: "1"
            # N25: the live per-file ceiling. `STEP_MB` is the smallest drop
            # worth a verb to the slot; `INTERVAL_S` is how stale the number a
            # *newly forked* process inherits can be, which is what a command
            # that writes several files one after another spends -- 0.1 s is
            # ~25 MiB at the writer speed measured on this NAS (~250 MiB/s).
            - name: E2B_DISK_TIGHTEN_STEP_MB
              value: "1"
            - name: E2B_DISK_TIGHTEN_INTERVAL_S
              value: "0.05"
            # N31: the *entry* cap. The byte budget cannot see a tree that
            # grows by names -- measured on the cluster, 2000 empty files left
            # the reported usage at 0 bytes, so a sandbox could spend the
            # volume's inodes without ever touching its budget. 500k is a
            # runaway backstop, not a policy: a heavy legitimate install is
            # tens of thousands of files, and creating 500k through the
            # mediator would take hours anyway (~21 ms per name measured), so
            # what this defends is the *volume* (inodes and walk cost shared
            # with every other sandbox), not the speed of the writer.
            # （口径见 docs/sandbox-disk-quota.md §1.1 的“第二维”；N30 定不新增旋钮）
            - name: E2B_DISK_MAX_ENTRIES
              value: "500000"
            # N25: pushed appends wake a scan round instead of waiting for the
            # 1 s cadence, so the remaining budget (and with it the per-file
            # ceiling) follows a fast writer. The trigger is a floor on "worth
            # a round"; the interval is the ceiling on how often one runs.
            #
            # Measured (2026-09-19, three runs): with 8 MiB / 0.2 s the
            # overshoot past a 1024 MiB budget was 124–339 MiB, because a
            # command that writes several files hands each new one the
            # remaining budget as of the *last* tightening, and two 124 MiB
            # files can start and finish between two rounds. At 1 MiB / 0.05 s
            # the three runs were 124 / 246 / 124 MiB (acceptance is a quarter
            # of the budget). The rest of that gap is sampling granularity: the
            # mediator samples a descriptor every 100 ms
            # (`SANLOCK_APPEND_INTERVAL_MS`), and these writers fill 124 MiB in
            # ~250 ms, so a whole file can land inside one sample.
            - name: E2B_DISK_APPEND_TRIGGER_MB
              value: "1"
            - name: E2B_DISK_APPEND_MIN_INTERVAL_S
              value: "0.05"
            # N25: what happens when a round *measures* a sandbox over its
            # budget. `log` (here, and the product semantic) keeps the existing
            # behaviour: the write gate is already shut by the zero ceiling and
            # the `ENOSPC` for new names, the control plane records it, and
            # nothing is frozen -- the sandbox keeps the reads and deletes it
            # needs. `deny` additionally pins the gate shut for
            # `E2B_DISK_OVERRUN_DENY_S` so a stale estimate cannot re-open it.
            # The fleet view reports both via
            # `/internal/fleet/metrics` -> `workspaceDisk.sandboxes` (how many
            # are over) and `workspaceDisk.overMB` (how far over in total).
            - name: E2B_DISK_OVERRUN_ACTION
              value: "log"
            - name: E2B_DISK_OVERRUN_DENY_S
              value: "60"
            # N25/A': how often the mediator samples a watched descriptor.
            #
            # 20 ms, not 100 ms, and cheap enough to be worth it because the
            # sampler no longer has to find the sandbox's copy of the
            # descriptor: the injection dups the mediator's own fd into the
            # sandbox, so the mediator reads the offset from its own
            # `/proc/self/fdinfo` -- no pid translation, no permission on
            # another process, and nothing a redirection can move. That copy
            # is the second choice; the sandbox's own descriptor is still read
            # first, and a path scan is the last resort.
            #
            # This is the *sampling* half of the residual in §22.5.8: a file
            # that opens, fills and closes inside one interval is only counted
            # when some interval catches it, and these writers fill 124 MiB in
            # ~250 ms. The round cadence (`..._MIN_INTERVAL_S` above) is left
            # alone on purpose -- rounds cost a ledger scan, samples cost a
            # read.
            - name: SANLOCK_APPEND_INTERVAL_MS
              value: "20"
            - name: E2B_NODE_PROCESSES
              value: "256"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          # A6: no SYS_ADMIN. ① the shared-volume ``mount --bind`` was deleted
          # in A4 (virtual paths + A5 traversal bits); ② XFS project quota is
          # served by the server-side quota-agent (E2.6) -- point
          # E2B_QUOTA_AGENT_URL at its endpoint, whereas the worker's local
          # direct ``xfs_quota -x`` path needs SYS_ADMIN and is not the
          # deployment form. This manifest set ships NO quota-agent, so the
          # k8s default is the *degraded* form (no per-sandbox hard limit +
          # one WARNING) unless an agent is pointed at from outside; the
          # stance and its consequences are pinned in
          # docs/production-deployment-requirements.md §2.4.4 (W4); ③ the :53
          # wildcard-DNS gateway binds inside each sandbox's own netns
          # (`E2B_ENABLE_NET_ISOLATION` is on for this pod), where the guest's
          # root-in-userns CAP_NET_BIND_SERVICE covers port 53 -- the pod-level
          # window was deleted in N5 (2026-09-17) and is not needed.
          securityContext:
            # C3 (Task 4 slice B): the worker's bounding set is the **empty
            # set**, and this is now *literally* true -- `drop: [ALL]` with
            # nothing added, so `CapBnd=0`.
            # Track F/C1 kept `SETUID`/`SETGID` here because the image's
            # file-capability `e2b-slot-spawn` was refused at `exec` unless its
            # caps were a subset of the container's bounding set. That binary
            # is no longer in the image (nor is `e2b-maint`), and the slot's
            # identity is now granted by the agent, so nothing in this worker
            # needs a capability -- which is the property 判据 2/15 pin.
            # (`SETUID`/`SETGID` are what `e2b-slot-spawn` needed; every other
            # cap was already gone: CHOWN/DAC_OVERRIDE moved to the C1 broker in
            # wave 2, NET_BIND_SERVICE had no user after N5 moved the :53 bind
            # into each sandbox's own netns.)
            #
            # Review round 2 (item 4): the earlier shape was "no `capabilities:`
            # block at all". That reads as a BND of zero in the *review text*
            # but not on the node -- omitting the block inherits the runtime's
            # **default** bounding set, and the cluster read `CapBnd=0x…a80425fb`
            # (`docs/deploy-clusters.md` §7.9/§7.10). Declaring the drop makes
            # the target and the reading agree (`CapEff` was already 0).
            capabilities:
              drop:
                - ALL
            #
            # The explicit, non-root identity below is **load-bearing for
            # C3's file operations**, not a restatement of the image's `USER`:
            # the control plane's trusted source for "what uid/gid is this
            # worker?" (`control_plane/worker_identity_source.py`) reads the
            # worker pod's `securityContext` through the pod API and returns
            # `None` when the pod spec pins nothing. A `None` identity stores
            # no worker uid/gid and every identity-needing operation then
            # answers a named 503 -- the image's `USER` is invisible to that
            # lookup. `runAsGroup` is not optional either: the tree's group is
            # the worker's gid.
            runAsUser: 65534
            runAsGroup: 65534
            # Node-local state: the kubelet resolves a Localhost profile on the
            # host filesystem, so deploy/k8s/seccomp-installer.yaml (ConfigMap +
            # DaemonSet) installs deploy/seccomp/sandlock-worker.json into the
            # kubelet's seccomp root on every node. Apply it *first* and wait for
            # the DaemonSet to be ready; a node without the file cannot start
            # this pod at all. Copying the file by hand still works for a
            # one-off node, but the DaemonSet is the reproducible path.
            # The profile is the runtime default plus `pidfd_getfd` and a
            # **narrowed** `unshare` (the argument mask keeps the namespace
            # types this deployment builds and refuses the rest) -- see
            # deploy/seccomp/README.md. `Localhost` (not `Unconfined`) also keeps
            # this pod on the allowed side of the Pod Security "baseline" rule.
            seccompProfile:
              type: Localhost
              localhostProfile: sandlock-worker.json
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
            # N57 / Task 3: the sandbox tree root, on the node's own disk. The
            # `shared` claim below still carries `_snapshots` / `_migrate` /
            # `_volumes` / `_images` -- everything whose reader is another node.
            # `workspace-root-init` in `deploy/k8s/c3-agent.yaml` creates this
            # directory and hands it to uid 65534 (this worker creates
            # `<root>/<id>` as that uid); `DirectoryOrCreate` is the fallback
            # for a node whose agent has not started yet, which would be
            # root-owned and fail the first create with EACCES.
            - name: workspace-root
              mountPath: /var/lib/e2b/workspaces
            - name: image-cache
              mountPath: /var/lib/e2b-images
            # N57 (Task 4): the node-local state base, the one root here the
            # worker *writes* into that is not on the shared volume. The
            # `workspace-root-init` container in `deploy/k8s/c3-agent.yaml`
            # (this deployment's only file-capable component, and its upstream)
            # creates it and hands it to uid 65534; `DirectoryOrCreate` is the
            # fallback for a node whose agent has not started yet -- kubelet
            # would then create it root-owned and the worker's first create
            # would fail with a loud EACCES on `<node_state>/_runtime/<id>/.creating`
            # (or `.route-b/**`) rather than writing into a directory nobody
            # styled. (The pool's `.uid_pool.lock` / `.uid_reservations/` are
            # *not* here -- N57 keeps them on the shared `E2B_STATE_BASE`.)
            - name: node-state
              mountPath: /var/lib/e2b/state
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
        # The sandbox tree root (N57 / Task 3): node-local, and *not* the shared
        # claim. ~75 GiB free on this disk, shared with the 4 GiB image cache
        # and the node-local state; the standing budget for the trees
        # themselves is `E2B_NODE_DISK_MB` (8192 MiB = 8 sandboxes x 1 GiB),
        # which is 16% of the free space (`docs/create-local-first-design.md`
        # §2.3). hostPath rather than emptyDir: a pod restart must not lose the
        # trees -- and with the trees node-local, "the node's disk" *is* the
        # durability boundary (the sandbox is not a durable object; snapshots
        # and volumes are).
        - name: workspace-root
          hostPath:
            path: /var/lib/e2b/workspaces
            type: DirectoryOrCreate
        # Node-local, and deliberately NOT the shared PVC: this is the extracted
        # image rootfs cache, and unpacking one onto the shared volume costs 240x
        # what it costs here (61.4s vs 0.26s for the same rootfs; N18). It is a
        # hostPath rather than an emptyDir because it must survive pod restarts --
        # the compose stack's equivalent is a named volume on the host's disk --
        # and "node-local" is exactly its scope.
        - name: image-cache
          hostPath:
            path: /var/lib/e2b-images
            type: DirectoryOrCreate
        # Node-local platform state (N57 / Task 4): `/var/lib/e2b/state`, the
        # same node disk as the cache above and *not* an emptyDir -- the
        # create's chips and the pool's lock have to survive a pod restart
        # (a marker that vanished with the pod would let a racing teardown into
        # a create that is still running). ~75 GiB free here, shared with the
        # 4 GiB image cache; this base holds only tiny files (see the
        # `E2B_NODE_STATE_BASE` comment above).
        - name: node-state
          hostPath:
            path: /var/lib/e2b/state
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: sandlock
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: e2b-worker
  ports:
    - port: 49983
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: e2b-worker
