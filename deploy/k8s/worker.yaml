apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2b-worker
  template:
    metadata:
      labels:
        app: e2b-worker
    spec:
      # A6/fix-1: the wildcard-allowOut DNS gateway binds <127.0.1.x>:53 from the
      # worker's own network namespace (shared-netns form, the default one).
      # The worker image builds with `USER 65534:65534`
      # (deploy/docker/Dockerfile.envd) and this pod does NOT override it, so
      # `capabilities.add: NET_BIND_SERVICE` is *not* enough: a non-root process
      # gets no effective capabilities (Kubernetes has no ambient-capability
      # semantics) and with the kernel-default `ip_unprivileged_port_start=1024`
      # the bind fails with EACCES. Measured on the Docker engine in this repo's
      # test image (tmp/a6fix1-cap-probe.log):
      #   uid 65534 + NET_BIND_SERVICE + sysctl=1024 -> CapEff=0, bind :53 EACCES
      #   uid 65534 + NET_BIND_SERVICE + sysctl=0    -> bind :53 OK
      #   uid 0     + NET_BIND_SERVICE + sysctl=1024 -> CapEff=0x400, bind :53 OK
      # So the low-port window has to be DECLARED, exactly like the compose
      # deploy does -- it is what covers both shapes (an older pushed image that
      # still ran as root is satisfied by NET_BIND_SERVICE; the current
      # Dockerfile's 65534 image is *not*, and the sysctl is harmless for both).
      # sysctls are pod-level (this is PodSecurityContext, not the container's);
      # the sysctl is *safe* since k8s 1.22 (no kubelet
      # --allowed-unsafe-sysctls needed), but `net.*` sysctls are refused with
      # hostNetwork: true. MCP inbound ports are 50005+ and never needed it.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          ports:
            - containerPort: 49983
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ADDRESS
              value: http://$(POD_NAME).worker-headless.sandlock.svc.cluster.local:49983
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_INTERNAL_API_KEY
              value: "internal-key"
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b-sandboxes
            - name: E2B_BASE_IMAGE
              value: python:3.14-slim
            - name: E2B_NODE_MEMORY_MB
              value: "2048"
            - name: E2B_NODE_CPU_PERCENT
              value: "200"
            - name: E2B_NODE_DISK_MB
              value: "4096"
            - name: E2B_NODE_PROCESSES
              value: "256"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          # A6: no SYS_ADMIN. ① the shared-volume ``mount --bind`` was deleted
          # in A4 (virtual paths + A5 traversal bits); ② XFS project quota is
          # served by the server-side quota-agent (E2.6) -- point
          # E2B_QUOTA_AGENT_URL at its endpoint, whereas the worker's local
          # direct ``xfs_quota -x`` path needs SYS_ADMIN and is not the
          # deployment form; ③ the :53 wildcard-DNS gateway is enabled by the
          # pod-level sysctl above (NET_BIND_SERVICE alone does not cover it for
          # this non-root pod -- see the comment there).
          securityContext:
            capabilities:
              # Kept for a root override (runAsUser: 0); inert for the default
              # non-root pod, which relies on the sysctl above.
              add: ["NET_BIND_SERVICE"]
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: sandlock
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: e2b-worker
  ports:
    - port: 49983
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: e2b-worker
