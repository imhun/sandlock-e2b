apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2b-worker
  template:
    metadata:
      labels:
        app: e2b-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          ports:
            - containerPort: 49983
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ADDRESS
              value: http://$(POD_NAME).worker-headless.sandlock.svc.cluster.local:49983
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_INTERNAL_API_KEY
              value: "internal-key"
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b-sandboxes
            - name: E2B_BASE_IMAGE
              value: python:3.14-slim
            - name: E2B_NODE_MEMORY_MB
              value: "2048"
            - name: E2B_NODE_CPU_PERCENT
              value: "200"
            - name: E2B_NODE_DISK_MB
              value: "4096"
            - name: E2B_NODE_PROCESSES
              value: "256"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          # A6: no SYS_ADMIN. ① the shared-volume ``mount --bind`` was deleted
          # in A4 (virtual paths + A5 traversal bits); ② XFS project quota is
          # served by the server-side quota-agent (E2.6) -- point
          # E2B_QUOTA_AGENT_URL at its endpoint, whereas the worker's local
          # direct ``xfs_quota -x`` path needs SYS_ADMIN and is not the
          # deployment form; ③ the wildcard DNS gateway's :53 is covered by
          # NET_BIND_SERVICE because this pod runs as root.
          #
          # Only a non-root pod needs the low-port window declared, and it is
          # *pod*-level (spec.template.spec.securityContext, not the container
          # one):
          #   securityContext:
          #     sysctls:
          #       - name: net.ipv4.ip_unprivileged_port_start
          #         value: "0"
          # That sysctl is safe since k8s 1.22 (no kubelet
          # --allowed-unsafe-sysctls), but net.* sysctls are refused with
          # hostNetwork: true. MCP inbound ports are 50005+ and need neither.
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: sandlock
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: e2b-worker
  ports:
    - port: 49983
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: e2b-worker
