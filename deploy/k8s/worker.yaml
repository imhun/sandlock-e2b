apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2b-worker
  template:
    metadata:
      labels:
        app: e2b-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          ports:
            - containerPort: 49983
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2B_NODE_ADDRESS
              value: http://$(POD_NAME).worker-headless.sandlock.svc.cluster.local:49983
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_INTERNAL_API_KEY
              value: "internal-key"
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b-sandboxes
            - name: E2B_BASE_IMAGE
              value: python:3.14-slim
            - name: E2B_NODE_MEMORY_MB
              value: "2048"
            - name: E2B_NODE_CPU_PERCENT
              value: "200"
            - name: E2B_NODE_DISK_MB
              value: "4096"
            - name: E2B_NODE_PROCESSES
              value: "256"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          securityContext:
            capabilities:
              add: ["SYS_ADMIN", "NET_BIND_SERVICE"]
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: sandlock
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: e2b-worker
  ports:
    - port: 49983
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e2b-worker
  namespace: sandlock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: e2b-worker
