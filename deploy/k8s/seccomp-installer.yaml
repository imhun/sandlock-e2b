    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"kcmp",
    				"process_madvise"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYS_PTRACE"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"iopl",
    				"ioperm"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYS_RAWIO"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"settimeofday",
    				"stime",
    				"clock_settime"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYS_TIME"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"vhangup"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYS_TTY_CONFIG"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"get_mempolicy",
    				"mbind",
    				"set_mempolicy"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYS_NICE"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"syslog"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "",
    			"includes": {
    				"caps": [
    					"CAP_SYSLOG"
    				]
    			},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"mount"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [
    				{
    					"index": 2,
    					"value": 0,
    					"op": "SCMP_CMP_EQ"
    				}
    			],
    			"comment": "N35 / real root: the sandbox's own setup binds the workspace, volumes and /dev nodes into the root it pivots into. Allowed without the CAP_SYS_ADMIN gate on purpose: that gate is resolved against the *container's* capability set when the container starts, while the capability that authorises the call belongs to the sandbox's own user namespace -- so the gated rule above is dropped in exactly the production shape that needs this. The argument filter is the second half: index 2 is the filesystem type, and the real root only ever binds (NULL fstype), so this rule cannot mount a filesystem -- tmpfs, procfs, overlayfs and the rest stay refused for every process in this container. The workload gets nothing: the sandbox's own filter denies mount, and CAP_SYS_ADMIN is dropped before it starts (docs/chroot-workspace-exec.md sections 7 and 9.5).",
    			"includes": {},
    			"excludes": {}
    		},
    		{
    			"names": [
    				"umount2",
    				"pivot_root"
    			],
    			"action": "SCMP_ACT_ALLOW",
    			"args": [],
    			"comment": "N35 / real root, same two calls' companions: `umount2(MNT_DETACH)` to drop the old root and `pivot_root` to make the new one the process root. No argument filter on these: their argument lists are too short for one (an index past the end reads whatever the caller left in the register, and libseccomp rejects the rule), and they need no filter -- both are bounded by the kernel's own rules, which let a process in a user namespace touch only mounts that namespace owns. The workload is refused both by the sandbox's filter and by the dropped capability.",
    			"includes": {},
    			"excludes": {}
    		}
    	]
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-installer
  namespace: sandlock
  labels:
    app: seccomp-installer
spec:
  selector:
    matchLabels:
      app: seccomp-installer
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: seccomp-installer
      annotations:
        # sha256 of the profile payload. Bump it (with the ConfigMap) when the
        # profile changes: the pod template hash change is what rolls the
        # DaemonSet, and the test above fails until the two agree.
        checksum/profile: "071486c06782c70d6764184493b104ed4418f77a244cb4198e14db70091ee27c"
    spec:
      # Every node, including tainted control-plane nodes: a node without the
      # profile cannot run the worker pod at all.
      tolerations:
        - operator: Exists
      # ...but not onto *virtual* nodes (ACK's ECI / any virtual-kubelet).
      # The blanket toleration above is what puts it there, and the pod then
      # never runs: measured on the main cluster (2026-09-17) the DaemonSet was
      # 5/7 with two pods stuck in `NotSupport` on the virtual-kubelet nodes, so
      # a DaemonSet rollout *never converges* -- which makes §2's "wait for the
      # DaemonSet to be Ready on every node" hang forever for an operator.
      # `NotIn` also matches nodes that carry no `type` label at all, so this is
      # a no-op on clusters without virtual nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
      # No priorityClassName: `system-node-critical` only exists on clusters
      # that created it (kubeadm does, vanilla does not), and a missing class
      # rejects the pod outright. Clusters that have it can add it here.
      restartPolicy: Always
      containers:
        - name: installer
          # Same image (and version tag, bumped per release) as the worker
          # Deployment: it is already present in the registry and pulled by
          # every node. Any image with /bin/sh + cmp works if a smaller one is
          # preferred.
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |-
              set -eu
              src=/config/sandlock-worker.json
              # The kubelet's seccomp root is *derived from its --root-dir*, not a
              # fixed path: kubeadm points --root-dir at /var/lib/kubelet, k0s at
              # /var/lib/k0s/kubelet (measured 2026-09-17: a pod with
              # localhostProfile: x.json failed with
              # `cannot load seccomp profile "/var/lib/k0s/kubelet/seccomp/x.json"`).
              # E2B_SECCOMP_ROOT is set to the kubelet's own directory; the
              # hostPath below must point at the same directory.
              root="${E2B_SECCOMP_ROOT:-/var/lib/kubelet/seccomp}"
              dst="$root/sandlock-worker.json"
              echo "installer up: $src -> $dst"
              while true; do
                if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
                  # Atomic replace: a partially written profile must never be
                  # what the kubelet picks up for a new container.
                  tmp="$root/.sandlock-worker.json.$$"
                  cp "$src" "$tmp"
                  chmod 0644 "$tmp"
                  mv "$tmp" "$dst"
                  echo "installed $dst ($(wc -c < "$dst") bytes)"
                fi
                sleep 300
              done
          env:
            # Must equal the hostPath below. The default matches a kubelet whose
            # --root-dir is /var/lib/kubelet (kubeadm, most managed clusters);
            # k0s uses /var/lib/k0s/kubelet -- deploy/k8s/selfhosted/ patches
            # both this value and the hostPath together.
            - name: E2B_SECCOMP_ROOT
              value: /var/lib/kubelet/seccomp
          securityContext:
            # root only to write inside the node's kubelet root; nothing else
            # is granted (no privileged, no caps, read-only rootfs).
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: profile
              mountPath: /config
              readOnly: true
            - name: kubelet-seccomp-root
              mountPath: /var/lib/kubelet/seccomp
      volumes:
        - name: profile
          configMap:
            name: sandlock-worker-seccomp
        - name: kubelet-seccomp-root
          hostPath:
            # The kubelet's seccomp root (= <kubelet --root-dir>/seccomp, which the
            # kubelet resolves Localhost profiles against). Keep in step with
            # E2B_SECCOMP_ROOT above and the mountPath; the selfhosted overlay
            # rewrites all three for k0s.
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
