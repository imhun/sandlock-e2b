# Installs the worker seccomp profile into every node's kubelet seccomp root.
#
# Why a DaemonSet and not just a ConfigMap volume: `seccompProfile.type:
# Localhost` is resolved by the *kubelet* on the node's filesystem (the seccomp
# root, `/var/lib/kubelet/seccomp` by default, `--seccomp-default-root` if the
# cluster moved it), and the runtime reads that path on the host. A ConfigMap
# mounted into the worker pod is invisible to that lookup, so the content has to
# be written to the node -- which is exactly what this DaemonSet does.
#
# Order matters: apply this *before* rolling the worker Deployment, and wait for
# the DaemonSet to be ready on every node; `/var/lib/kubelet/seccomp` is
# `DirectoryOrCreate` so a node that never used a Localhost profile still works.
#
# Changing the profile: edit deploy/seccomp/sandlock-worker.json, re-run
# tests/unit/test_worker_manifest_permissions.py (it pins both the embedded copy
# and the checksum annotation below), then `kubectl apply -f seccomp-installer.yaml`.
# The `checksum/profile` annotation on the pod template changes with the content,
# which rolls the DaemonSet immediately; the container also re-checks every 5
# minutes, so a missed rollout still converges without touching the kubelet
# (kubelet reads the file per container creation -- no restart needed).
#
# SELinux: on an enforcing host the write into the kubelet root can be refused;
# the usual remedy is `securityContext.seLinuxOptions: {type: spc_t}` on this
# container (left out by default so non-SELinux clusters keep the narrower
# context). Symptoms are `cp: cannot create regular file ...: Permission denied`
# in this pod's logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandlock-worker-seccomp
  namespace: sandlock
  labels:
    app: seccomp-installer
data:
  # Byte-for-byte the file at deploy/seccomp/sandlock-worker.json (pinned by
  # tests/unit/test_worker_manifest_permissions.py); sha256 071486c06782c70d6764184493b104ed4418f77a244cb4198e14db70091ee27c
  #
  # `|` (keep), NOT `|-` (strip). The profile file ends with a newline, so `|-`
  # hands the node a payload one byte shorter than the very file this comment
  # and the annotation name. That is not hypothetical: the file had no trailing
  # newline at 8ea5909 (so `|-` was then exact), a later pass added one, and the
  # N35 resync copied the text without noticing -- measured 2026-09-25, the
  # applied value hashed to e79a1c6a while the annotation said 071486c0. A
  # trailing newline is inert for JSON and for the kubelet, but it makes every
  # "byte-for-byte" claim on this file quietly false, and the text-style test
  # could not see it (it dedented the source instead of reading the YAML value).
