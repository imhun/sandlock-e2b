apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          # SECURITY: production must enable authentication. Mirror the
          # compose stack: add "--requirepass", "$(REDIS_PASSWORD)" and feed
          # REDIS_PASSWORD from a Secret, then point control-plane's
          # E2B_REDIS_URL at redis://:<password>@redis:6379/0. Without this,
          # a full-egress sandbox can read/write the shared ledger.
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandlock
spec:
  selector:
    app: redis
  ports:
    - port: 6379
