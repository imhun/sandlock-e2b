# C3（Task 3）：每节点一个 agent —— 槽位身份的**唯一授予者**。
#
# 它承接两件事，因此是**一个 DaemonSet、两个容器**（`plan §2.0` 定案）：
#
#   face A `agent` —— 身份授予。CP 把「哪个节点、哪个沙箱、哪个 uid、哪个 pid」发过来，
#     它用宿主 `/proc` 把 worker 报的**容器 pid** 反查成**宿主 pid**（所以必须
#     `hostPID: true`），再让镜像里那个面 A 原语写一次 `uid_map`。它以 **65534** 跑，
#     容器 BND 里带上 `SETUID`/`SETGID` —— 这是**声明**不是授权：file capability 必须是
#     容器 BND 的子集，否则内核在 `exec` 那一步就拒绝（非 root 进程的 `CapEff` 仍是 0）。
#
#   face B `maint` —— 文件操作面（C1 的 `e2b-maint` 原样搬进来，**复用
#     `deploy/priv/priv_common.c` 的路径白名单纪律，不另写一套**）。它必须是 **root**：
#     工作区在阿里云 NAS 上走 AUTH_SYS，`chown` 只有 uid 0 做得成（2026-09-17 实测，
#     见 `deploy/k8s/priv-broker.yaml` 文件头）。**能力集与 C1 的 broker 逐条相同** ——
#     本任务只搬家，不扩面。载荷是 **Task 4 片 B 装上的**：与面 A **同一个服务**
#     （`python3 -m deploy.c3_agent`，一张 op 表），但听**自己的端口 49986**（裁定 D22）：
#     两个容器共享 pod netns，都绑 49985 会 `EADDRINUSE`；而把 file op 送到 65534 的面 A
#     上，NFS 上每个 chown 都会 `EPERM`（看起来像权限 bug 的失败）。控制面按
#     `E2B_C3_AGENT_MAINT_PORT` 寻址它。
#
# ⚠ `hostPID` 是 **pod 级**字段 ⇒ face B 也会拿到它。这是 `plan §2.0` 明确点名接受的
#   增量（face B 本来就是 root + `DAC_OVERRIDE`），不是顺手漏出来的。
#
# ⚠ **身份是「宿主/节点」的名字**（D12）：`E2B_C3_AGENT_NODE_ID` 取自
#   `spec.nodeName`，**不是** pod 名。一个节点上可能同时有多个 worker（k8s 2 个副本；
#   multinode compose 三个 worker 同机）——用 worker pod 名当身份会歧义。CP 侧的寻址器
#   正是按"worker pod → `spec.nodeName`"解析的，worker 自己的身份（pod 名 + pod UID +
#   它记的 pid namespace）随指令体一起下发。
#
# ⚠ **红线**（`plan §2.3`）在本文件里逐条成立：没有内核特权大件、没有 host 网络、没有
#   特权容器、也**没有**任何"禁止提权"式的字段 —— 后者会让内核**静默忽略** file
#   capabilities，face A 会像装好了却永远授不出身份（判据 11）。本文件里连这些词都
#   不出现在注释里，免得文本级 pin 被自己的说明骗过。
#
# 暴露面：agent 只应答 **CP**（下面的 NetworkPolicy 是"只有两条通道"的连接层那一半；
# 服务自己的 token 检查是第二半，不是替代）。`worker ↔ agent` 这条通道不存在。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: e2b-c3-agent
  namespace: sandlock
  labels:
    app: c3-agent
spec:
  selector:
    matchLabels:
      app: c3-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: c3-agent
    spec:
      # face A 的反查要读**宿主**的进程表；这是它唯一的特权形态，且它不因此获得任何
      # 能力（只影响可见性）。
      hostPID: true
      # 调度域与 worker/broker 完全一致：虚拟节点（ECI/任何 virtual-kubelet）跑不了
      # 这个 pod，那里也没有 worker 需要它。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
      # C3 Task 5 (D24): the platform-storage ownership jobs, moved off the
      # control-plane pod -- §3.2 step 3's `image-cache-init`, plus the volume
      # store's hand-over that D24 added in its place.
      #
      # Both are "hand a directory on the shared mount to the uid that writes
      # it", and both need uid 0 for the same reason face B does (`chown` on
      # this NAS goes through AUTH_SYS, which honours only uid 0):
      #
      #   * `_images` -- the rootfs/OCI cache. The control plane (now 65534)
      #     exports the template layout tars into `_images/_oci/` and the
      #     workers extract from the same root, so it has to belong to 65534
      #     before either writes. Moved verbatim from the control-plane pod:
      #     the recursive form is safe *there* because the shared `_images`
      #     holds only `_oci/` (per-sandbox secrets live in the node-local
      #     `E2B_IMAGE_CACHE_DIR`, `/var/lib/e2b-images`, whose directories the
      #     broker's own init owns -- Task 7 retires that copy).
      #   * `_volumes` -- the volume store. The control plane creates
      #     `<store>/<volume_id>` and writes `<store>/_meta/<volume_id>.json`,
      #     and with the CP at 65534 both are *owner* operations only if the
      #     store belongs to it. D24: the hand-over is one `chown` of the store
      #     itself, **non-recursive on purpose** -- the entries below it are the
      #     sandbox volume data (`<id>/` and the per-sandbox quota slices),
      #     which belong to pooled sandbox uids and must never be taken back by
      #     a platform rollout. The recursive form is the regression this file
      #     must not acquire.
      #
      # Idempotent and audible: every target is either "already belongs to uid
      # 65534" (nothing to do -- the second node of a shared mount lands here)
      # or "handed over", and the store's own ownership is *verified*, so an
      # NFS `root_squash` that refuses the chown stops this pod with the exact
      # one-time fix instead of failing later, at the first volume create,
      # inside the control plane (which now names the same command --
      # `control_plane.registry.volumes.VolumeRootNotOwnedError`).
      initContainers:
        - name: storage-init
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-agent:0.1.0
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |-
              set -e
              # 1. The shared rootfs/OCI cache, before the control plane or any
              #    worker writes it (Z-F7 C1, moved here by C3 Task 5).
              for dir in $CACHE_DIRS; do
                mkdir -p "$dir/_oci"
                chmod 0755 "$dir" "$dir/_oci" 2>/dev/null || true
                chown -R 65534:65534 "$dir" 2>/dev/null ||
                  echo "storage-init: chown refused ($dir, NFS root_squash?) -- verifying the owner instead"
                owner="$(stat -c %u "$dir")"
                if [ "$owner" != "65534" ]; then
                  echo "storage-init: FATAL: $dir is owned by uid $owner, not the worker uid 65534: a 65534 worker cannot create its lock files or staging trees there, so every image resolve would fail" >&2
                  echo "storage-init: fix it once (as root on the node, or on the NFS server): chown 65534:65534 $dir && chown -R 65534:65534 $dir/_oci" >&2
                  exit 1
                fi
                echo "storage-init: $dir is owned by uid 65534"
              done
              # 2. The volume store (D24). `hand_over` moves one directory's
              #    owner and nothing else; `_meta` is created lazily by the
              #    control plane, so a missing one is a no-op and not a failure.
              hand_over() {
                target="$1"
                if [ ! -e "$target" ]; then
                  echo "storage-init: $target does not exist -- nothing to hand over (the control plane creates it as its owner when it first needs it)"
                  return 0
                fi
                owner="$(stat -c %u "$target")"
                mode="$(stat -c %a "$target")"
                if [ "$owner" = "65534" ]; then
                  echo "storage-init: $target already belongs to uid 65534 (mode $mode) -- nothing to do"
                  return 0
                fi
                chown 65534:65534 "$target" 2>/dev/null ||
                  echo "storage-init: chown refused ($target, NFS root_squash?) -- the control plane (uid 65534) cannot create or record a volume until this is done once: chown 65534:65534 $target" >&2
                echo "storage-init: $target -> uid $(stat -c %u "$target") mode $(stat -c %a "$target") (a non-recursive hand-over; the sandbox volume data directories below it keep their pooled uids)"
                return 0
              }
              volume_store="$SHARED_ROOT/_volumes"
              if [ ! -e "$volume_store" ]; then
                # It has to *exist* before the control plane pod starts (that
                # pod mounts it as a subPath, and a missing subPath source
                # leaves it in ContainerCreating), and the control plane cannot
                # make it once it is uid 65534 unless the parent happens to be
                # writable. The broker's `workspace-root-init` creates it today
                # and Task 7 retires that pod, so this is where the creator
                # lives now -- root mkdir, then the same hand-over.
                mkdir -p "$volume_store"
                echo "storage-init: created $volume_store (the platform's volume store)"
              fi
              hand_over "$volume_store"
              hand_over "$volume_store/_meta"
              # ...and the gate the hand-over exists for. A store that is still
              # not 65534 after the attempt above fails *here*, loudly, rather
              # than as a bare EACCES in the control plane later.
              store_owner="$(stat -c %u "$volume_store")"
              if [ "$store_owner" != "65534" ]; then
                echo "storage-init: FATAL: $volume_store is owned by uid $store_owner, not the control-plane uid 65534: the control plane creates every volume as <store>/<volume_id> and writes <store>/_meta/<volume_id>.json, so the first volume create would fail with EACCES" >&2
                echo "storage-init: fix it once (as root on the node, or on the NFS server): chown 65534:65534 $volume_store  (non-recursive: the volume data directories below it belong to pooled sandbox uids)" >&2
                exit 1
              fi
              echo "storage-init: $volume_store is owned by uid 65534 (the volume data directories below it are left alone)"
          env:
            - name: CACHE_DIRS
              value: /var/lib/e2b-sandboxes/_images
            - name: SHARED_ROOT
              value: /var/lib/e2b-sandboxes
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
      containers:
        # ------------------------------------------------------------------
        # face A：身份授予（非 root，两个 file capability）
        # ------------------------------------------------------------------
        - name: agent
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 49985
          env:
            # D12：身份 = **节点名**（不是 pod 名）。服务用它回答唯一那个本地问题
            # "这条指令是发给我的吗？"。
            - name: E2B_C3_AGENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # CP→agent 的唯一凭据。**它绝不出现在 worker 清单或 worker 镜像里**
            # （`tests/unit/test_c3_internal_api_shape.py` 的 pin），由
            # `deploy/k8s-k0s/secrets.sh` 与其他托管键一起生成。
            - name: E2B_C3_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_C3_AGENT_TOKEN
          securityContext:
            # 65534 = worker 自己的 uid：写 uid_map 要求写者 euid == 目标 user
            # namespace 的 owner，而那个 owner 就是"天生 65534"的 worker（§14.2.7）。
            runAsUser: 65534
            capabilities:
              # BND 声明：`as_uid` 的 file capabilities 必须是它的子集，否则 `exec`
              # EPERM。这两条对非 root 进程**不产生** CapEff。
              add:
                - SETUID
                - SETGID
          # 探针走 `exec`（容器内自连 127.0.0.1）：kubelet 的 httpGet 是从节点发起
          # 的网络请求，会被下面那条"只许 CP 进"的 NetworkPolicy 挡在半路。
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 49985), 2).close()"
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 49985), 2).close()"
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              # 一次授予 = 一次 `/proc` 扫描 + 一个 `as_uid` 子进程；并发上限由
              # CP 侧的 `E2B_C3_AGENT_MAX_CONCURRENCY` 管。这里是跑飞量的兜底。
              cpu: "1"
              memory: 256Mi
        # ------------------------------------------------------------------
        # face B：文件操作面（root + C1 的三条能力）—— Task 4 装上载荷
        # ------------------------------------------------------------------
        - name: maint
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-agent:0.1.0
          imagePullPolicy: IfNotPresent
          # Task 4 slice B: the payload. **The same service face A runs** --
          # one app, one op table (`grant-slot` + `chown`/`rm`/`walk`), so the
          # handler and the refusal shapes cannot drift between the faces. It
          # listens on **its own port** (D22): the two containers share the pod
          # netns, so a second listener on face A's 49985 would be
          # `EADDRINUSE`, and the control plane addresses the file verbs at
          # this one (`E2B_C3_AGENT_MAINT_PORT`).
          env:
            # D12: the same host identity face A carries. The control plane
            # puts *this host's* name in the URL path of every instruction
            # (face A's and face B's alike), and each face answers only for
            # itself.
            - name: E2B_C3_AGENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The same CP→agent credential as face A; **neither face's copy
            # ever appears on a worker** (`tests/unit/test_c3_internal_api_shape.py`).
            - name: E2B_C3_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_C3_AGENT_TOKEN
            # D22: face B's own port. Face A keeps 49985 (its `ports:` below
            # and the control plane's `E2B_C3_AGENT_PORT` default).
            - name: E2B_C3_AGENT_PORT
              value: "49986"
            # 与 C1 broker 逐字相同的四个白名单根（`priv_common.c` 的纪律）；
            # `E2B_STATE_BASE` 与 k8s worker 的 N27 形态逐字一致（`.route-b`
            # 与 `_runtime` 都在它下面）。
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b-sandboxes/workspaces
            - name: E2B_STATE_BASE
              value: /var/lib/e2b-sandboxes/state
            - name: E2B_SHARED_VOLUME_ROOT
              value: /var/lib/e2b-sandboxes
            - name: E2B_IMAGE_CACHE_DIR
              value: /var/lib/e2b-images
            # The uid pool is an input of `priv_common.c` (`--uid` is refused
            # outside `START..+SIZE`), and it must equal the worker it serves:
            # the k8s worker follows the code default, 10000/1000.
            - name: E2B_UID_POOL_START
              value: "10000"
            - name: E2B_UID_POOL_SIZE
              value: "1000"
          # The CP dials this port; nothing else may (the NetworkPolicy below
          # allows exactly the control plane's pod on the two agent ports).
          ports:
            - containerPort: 49986
          # Probes go through `exec` and self-connect on loopback, the same
          # reason face A's do: a kubelet `httpGet` is issued from the node and
          # is refused by the ingress rule.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 49986), 2).close()"
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 49986), 2).close()"
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            # NFS AUTH_SYS 只认凭据 uid：`chown` 给别人（比如池 uid 10000）只有 uid 0
            # 做得成。`drop: [ALL]` 必须配 `add`，否则这里只是"在 root 默认集上追加"。
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            # 与 worker 同一个 RWX claim、同一个路径：白名单按解析后的路径比较，
            # 属主/删除必须落在 worker 看得见的那些树上。
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
            # 节点本地的解包缓存（第四个白名单根），与 worker/broker 同一个 hostPath。
            - name: image-cache
              mountPath: /var/lib/e2b-images
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
        - name: image-cache
          hostPath:
            path: /var/lib/e2b-images
            type: DirectoryOrCreate
---
# "只有两条通道"的连接层那一半：agent 只接受 **control-plane** pod 进来的连接，
# 而且只在那一个端口上。worker 直接来敲会被网络层挡掉 —— 不靠 agent 自己判断
# （判据 ⑥ 的"连接层就拒"）。
#
# `policyTypes: [Ingress]` 只管入口：agent 今天不发起任何网络连接（它读 `/proc`、写
# 一次 uid_map），所以出口留给默认，不在这一条里做文章。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2b-c3-agent
  namespace: sandlock
spec:
  podSelector:
    matchLabels:
      app: c3-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: control-plane
      ports:
        # face A (`grant-slot`) ...
        - protocol: TCP
          port: 49985
        # ...and face B (`chown`/`rm`/`walk`, D22). Both are still
        # CP-only: the source pod selector above is one rule, and splitting the
        # port list inside it does not widen who may connect -- a second `from`
        # entry would.
        - protocol: TCP
          port: 49986
