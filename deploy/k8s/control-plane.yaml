apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sandlock
spec:
  # ONE replica, matching the compose stack the rest of this manifest set mirrors.
  # ⚠ The node registry is **per-process**: `NodeRegistry._nodes` is an in-memory
  # dict and only the *quota ledger* and the *sandbox records* go through Redis
  # (`control_plane/registry/nodes.py`, `redis_backend.py`). With two replicas
  # behind the Service, a worker's registration and its 5-second heartbeats
  # stick to whichever pod its HTTP connection reaches, so the other replica's
  # view of that node ages past the 15-second `heartbeat_timeout` and it marks a
  # perfectly healthy node `unhealthy`. Measured on k0s on 2026-09-17: replica A
  # reported `fxf2j: unhealthy` while replica B reported `fxf2j: healthy`, for 12
  # consecutive samples. Consequences seen live: `/internal/routes/<id>` served
  # by the stale replica answers `502 Node ... unavailable` (one blip in a 30s
  # window), placement only happens where the replica in question believes there
  # is capacity, and `reap_unhealthy` (E6.1) treats live sandboxes on the
  # "unhealthy" node as orphans -- which is what turned `deployment_smoke.py`'s
  # route lookup into a `404 Sandbox ... not found`. Raise this back to >1 only
  # after the node registry (health + addresses) is shared, not just its quotas.
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      # fsGroup 1000 exists for the buildkit sidecar: the emptyDir k8s creates
      # for it is root-owned, while rootless buildkitd runs as the image's uid
      # 1000 and must create its data directory *and* the unix socket inside it.
      # Group ownership gives it that, and the root control-plane container reads
      # the socket through the same volume (mounted read-only at /run/buildkit).
      securityContext:
        fsGroup: 1000
      # Z-F7 C1: this pod runs as root and exports template layout tars into
      # ``_images/_oci/`` on the shared PVC; the worker pods (65534) extract the
      # rootfs entries. Create the cache once with the worker's ownership before
      # either side writes -- never 0777, since a writable rootfs cache lets a
      # sandbox poison another sandbox's image -- and *verify* the ownership:
      # on NFS with root_squash the chown can be refused, and a best-effort init
      # that leaves the directory root-owned makes every image resolve on this
      # node fail afterwards (the 65534 worker cannot create its lock file).
      # The pod then stops in Init:Error with the exact one-time fix in its log
      # instead of starting and failing every create.
      # docs/production-deployment-requirements.md §2.7.1.
      initContainers:
        - name: image-cache-init
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |-
              set -e
              for dir in $CACHE_DIRS; do
                mkdir -p "$dir/_oci"
                chmod 0755 "$dir" "$dir/_oci" 2>/dev/null || true
                chown -R 65534:65534 "$dir" 2>/dev/null ||
                echo "image-cache-init: chown refused ($dir, NFS root_squash?) -- verifying the owner instead"
                owner="$(stat -c %u "$dir")"
                if [ "$owner" != "65534" ]; then
                  echo "image-cache-init: FATAL: $dir is owned by uid $owner, not the worker uid 65534: a 65534 worker cannot create its lock files or staging trees there, so every image resolve would fail" >&2
                  echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown -R 65534:65534 $dir" >&2
                  exit 1
                fi
                echo "image-cache-init: $dir is owned by uid 65534"
              done
          env:
            - name: CACHE_DIRS
              value: /var/lib/e2b-sandboxes/_images
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
      containers:
        - name: control-plane
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-control-plane-gateway:0.1.0
          ports:
            - containerPort: 3000
          env:
            - name: E2B_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_API_KEYS
            - name: E2B_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEY
            - name: E2B_ENABLE_LOCAL_NODE
              value: "false"
            # SECURITY: credentials come from the `e2b-secrets` Secret that the
            # deploy creates *before* applying this manifest set (the placeholders
            # that used to sit here are gone: a missing Secret now leaves the pod
            # in CreateContainerConfigError instead of silently arming the stack
            # with `local-key`). $(E2B_REDIS_PASSWORD) is expanded by the kubelet
            # from the variable above; redis.yaml puts the same value behind
            # --requirepass. Without auth a full-egress sandbox can read/write the
            # shared ledger.
            - name: E2B_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_REDIS_PASSWORD
            - name: E2B_REDIS_URL
              value: redis://:$(E2B_REDIS_PASSWORD)@redis:6379/0
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_GATEWAY_URL
              value: http://control-plane:3000
            - name: E2B_SHARED_WORKSPACE_ROOT
              value: /var/lib/e2b-sandboxes
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b-sandboxes
            # Track Z / Z-F7: same shared image cache as the workers. This
            # deployment runs 2 replicas over the same RWX PVC at the same
            # path, so with no E2B_IMAGE_REGISTRY configured Template.build
            # exports the OCI layout tar into ``_images/_oci/`` where the
            # workers (and the other replica) can resolve it; unset, each
            # replica wrote its own copy inside its container and the workers
            # could never see it. The per-image flock + atomic publish in
            # envd_service/runtime/image_resolver.py is what makes the shared
            # directory safe for two replicas, and E2B_IMAGE_CACHE_MAX_BYTES is
            # what bounds it (docs/production-deployment-requirements.md §2.7).
            - name: E2B_IMAGE_CACHE_DIR
              value: /var/lib/e2b-sandboxes/_images
            - name: E2B_IMAGE_CACHE_MAX_BYTES
              value: "4294967296"
            - name: E2B_IMAGE_CACHE_EVICT_MIN_AGE_S
              value: "300"
            # This pod runs as root and the workers as 65534, so the resolver
            # hands every directory and file it creates to the worker uid: the
            # worker writes as the owner, root writes through CAP_DAC_OVERRIDE,
            # and a sandbox uid (10000+) gets read/traverse bits only -- never
            # 0777, since a writable rootfs cache is a cross-tenant poisoning
            # vector. docs/production-deployment-requirements.md §2.7.1.
            - name: E2B_IMAGE_CACHE_OWNER_UID
              value: "65534"
            # ⚠ 共享工作区（RWX PVC）必须显式设 `E2B_MAX_TOTAL_DISK_MB`：
            # 它是控制面唯一的**舰队级**磁盘准入台账（Σ 活沙箱 disk_mb）——代码默认 10240，
            # 两个栈一直用的就是这个数，但藏在默认值里没人看得见。而每节点的
            # `E2B_NODE_DISK_MB` 是各记一份的预算 —— 共用一片存储时，只有这个数代表
            # 「我们这片 slice 卖出去多少」。取值看 PVC 声明多大（基线 `pvc.yaml` 是 50Gi）。
            # 不设 = 用代码默认值 10240（**不是**不限制；置 0 才是不限制）。写出来的意义是
            # 可 grep、可评审，而且拒绝时会带上 `workspaceDisk` 那个可观测的数。
            # 详见 docs/disk-quota-options.md §7 L1。
            # - name: E2B_MAX_TOTAL_DISK_MB
            #   value: "10240"   # 代码默认值；两个栈一直用的就是它
            - name: E2B_BASE_IMAGE
              # Same registry + digest pinning as the compose stack (E6.2: a
              # base image must be digest-pinned), and the same reason the redis
              # image is an ACR mirror -- Docker Hub is unreachable from the
              # deployment hosts. Digest verified against ACR 2026-09-17.
              value: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
            - name: E2B_TEMPLATE_IMAGES
              value: '{"py311": "registry.cn-shanghai.aliyuncs.com/byteplan/python:3.11-slim"}'
            - name: E2B_MAX_SANDBOXES
              value: "1000"
            # Template.build talks to the buildkit sidecar below over a unix
            # socket inside the shared `buildkit-data` emptyDir -- the same
            # arrangement (and the same address) as the compose stack, which
            # mounts the builder's socket volume read-only at /run/buildkit.
            # Without it every `Template.build` fails; the k8s manifest set had
            # no builder at all until 2026-09-17.
            - name: E2B_BUILDKIT_ADDR
              value: unix:///run/buildkit/buildkitd.sock
          volumeMounts:
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
            - name: buildkit-data
              mountPath: /run/buildkit
              readOnly: true
        # The builder. Rootless buildkitd (uid 1000 of the image) keeps its
        # socket inside its own data directory, which is why the control plane
        # above mounts that same emptyDir read-only rather than a socket path of
        # its own.
        - name: buildkit
          image: registry.cn-shanghai.aliyuncs.com/byteplan/buildkit:rootless
          securityContext:
            # buildkit is a builder, not a sandbox: it legitimately needs the
            # whole syscall surface (mount, clone, ...). It is also irrelevant to
            # what a sandbox can do -- the *worker's* profile is the one that must
            # stay narrowed (deploy/seccomp/sandlock-worker.json).
            seccompProfile:
              type: Unconfined
            # NOT allowPrivilegeEscalation: false, however tempting: setting it
            # makes the kubelet add no_new_privs, and rootlesskit then dies with
            # `newuidmap ... failed: newuidmap: Could not set caps` because the
            # kernel ignores newuidmap's setuid bit. Same mechanism the worker's
            # manifest calls out for its file-capability brokers. The compose
            # stack's buildkit container runs with the default (allowed), so this
            # matches it.
          volumeMounts:
            - name: buildkit-data
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
        # fsGroup 1000 (pod-level, below) is what lets the rootless builder write
        # here: the emptyDir arrives root-owned, and the builder runs as uid 1000.
        - name: buildkit-data
          emptyDir: {}
        - name: buildkit-config
          configMap:
            name: buildkitd-config
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sandlock
spec:
  selector:
    app: control-plane
  ports:
    - port: 3000
