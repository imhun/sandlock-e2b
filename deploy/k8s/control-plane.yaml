apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sandlock
spec:
  # TWO replicas: the node registry, its health verdicts and the periodic jobs
  # are shared now (F11, 2026-09-26). This block used to forbid >1 replica for a
  # measured reason -- `NodeRegistry._nodes` is an in-memory dict, so with two
  # replicas a worker's registration and its 5-second heartbeats stuck to
  # whichever pod its HTTP connection reached, and the other replica aged that
  # node past its heartbeat timeout. Measured on k0s 2026-09-17: replica A
  # reported `fxf2j: unhealthy` while replica B reported `fxf2j: healthy`, for 12
  # consecutive samples; live consequences were `502 Node ... unavailable` on
  # `/internal/routes/<id>`, placement where the replica in question believed
  # there was capacity, and `reap_unhealthy` (E6.1) orphaning live sandboxes
  # ("404 Sandbox ... not found" in `deployment_smoke.py`).
  #
  # What made >1 legal: the node view went to Redis (`e2b:node:view:<id>`, health
  # computed from the shared `heartbeat_at` in
  # `control_plane/registry/redis_backend.py::RedisNodeStore`), and the work that
  # must not be done twice became single-flight or fleet-wide -- the health sweep
  # (`try_acquire_sweep`), the TTL sweep (`e2b:ttl:sweep`), the snapshot copy
  # claim (`e2b:snapshot:copy:<id>`), the seven rate limiters and
  # `template_build_slots` (see `docs/control-plane-multi-replica.md` §6).
  # Two things are deliberately still per-replica: `CreateQueue` wakes only its
  # own waiters (a 0.25 s tick bounds the delay, correctness is unaffected), and
  # the in-process metrics (`recent503Count`, ...) are now a per-pod number.
  #
  # The strategy and the anti-affinity below are part of the shape, not tuning:
  # the default RollingUpdate with replicas=2 asks for a third pod, and this is a
  # two-node cluster, so a rollout would sit `Pending` forever.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      # Long enough for the in-flight work a SIGNAL 15 interrupts: uvicorn's
      # graceful shutdown drains requests, and the exec/MCP paths hold *long*
      # connections (a stream that is still running is *not* a stuck request).
      # The preStop sleep is deliberately shorter than this: it lets kube-proxy
      # take the pod out of the Service before the process starts closing, so
      # a request never lands on a replica that is already leaving.
      terminationGracePeriodSeconds: 60
      # C3 Task 2 (N49 / D5): the internal API resolves each node's *expected*
      # address by reading that node's pod (`E2B_NODE_ADDRESS_MODE=k8s` below),
      # and since 2026-09-30 this pod also hosts the worker fleet's autoscaler,
      # which scales the worker workload and retires a drained pod. Both are
      # covered by the Role/RoleBinding at the bottom of this file.
      serviceAccountName: control-plane
      # With replicas=2 on a two-node cluster, "both replicas on one node" is a
      # single point of failure that looks like a HA setup. Required, not
      # preferred: the scheduler must spread them, and `maxSurge: 0` above keeps
      # the rollout from ever needing a third slot.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: control-plane
              topologyKey: kubernetes.io/hostname
      # fsGroup 1000 exists for the buildkit sidecar: the emptyDir k8s creates
      # for it is root-owned, while rootless buildkitd runs as the image's uid
      # 1000 and must create its data directory *and* the unix socket inside it.
      # Group ownership gives it that, and the root control-plane container reads
      # the socket through the same volume (mounted read-only at /run/buildkit).
      securityContext:
        fsGroup: 1000
      # C3 Task 5 (D24): this pod carries **no root container at all**, so the
      # two ownership jobs that used to live here moved to the agent's own pod
      # (`deploy/k8s/c3-agent.yaml`, `storage-init`):
      #
      #   * Z-F7 C1's `image-cache-init` (root, chowned `_images` to 65534 and
      #     refused to start on a root_squashed NFS that would not take it);
      #   * the volume store's hand-over, added by D24 in its place (§3.2 step 2
      #     says "hand A3 to the agent"; recon for this task showed `_volumes`
      #     is not the CP's only write there -- `_volumes/_meta/<id>.json` is
      #     inside the same `0:0 755` root -- so *both* routes need the
      #     ownership change anyway, and the remaining delta of the agent route
      #     is a new `mkdir` verb inside the **root** `e2b-maint` plus a new
      #     node-addressing rule for a shared-storage op. D24 keeps the CP's own
      #     `mkdir`/`chmod` and makes them ordinary owner operations instead.
      #     The deviation is recorded in `docs/c3-privilege-relocation.md` §13.6).
      #
      # The control plane therefore has no `initContainers` left: it starts as
      # uid 65534 (below) and every path it writes belongs to it.
      containers:
        - name: control-plane
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-control-plane-gateway:0.1.0
          # C3 Task 5 (ruling D24 / §3.2 step 1): the control plane is the
          # worker's uid, and that is a *measured* choice, not a symmetry:
          # all of the platform's own directories on the shared volume are
          # already `65534:65534`, `state/.uid_pool.lock` is `65534:65534 0600`
          # (a different uid cannot even open it, and it is touched at startup
          # -- the first uid allocation), and the image cache's owner is 65534,
          # so a different uid would create cache entries it could no longer
          # write. `runAsGroup` goes with it: a `65534:0` container would write
          # every record with the root group.
          #
          # The price is real and named: CP and worker are no longer
          # distinguishable at the filesystem layer. Buying that back is a
          # dedicated uid plus a second migration package (§13.2 / §13.6's
          # "三条合起来指向同一个结论"), not a side change.
          #
          # ⚠ The `buildkit` sidecar below is the one container in this pod that
          # is *not* held to this: it stays uid 1000 (the image's) with
          # `seccompProfile: Unconfined`. It is not root, so it does not break
          # the口径, but it is the only wide-profile container left here and the
          # plan requires it to be named rather than left implicit (§3.2).
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          ports:
            - containerPort: 3000
          # `/healthz` is the static 200 in `control_plane/app.py` -- it says
          # "this process is serving", not "Redis and the shared volume are
          # fine". That is the right question for these two probes: with
          # `maxUnavailable: 1` the rollout deletes before it creates, and
          # readiness is what keeps the Service from sending traffic to a pod
          # that is not listening yet.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # BestEffort was the old shape (no requests at all), which lets the
          # scheduler place this pod anywhere -- including a node whose worker
          # already holds its budget. These are small on purpose: a node has 4
          # cores, the worker asks for 500m/512Mi, and this pod also carries the
          # buildkit sidecar.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: E2B_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_API_KEYS
            - name: E2B_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEY
            # O3 Task 3: the rotation window for `X-Internal-Key` (E3.6).
            # `config.py::all_internal_api_keys` unions this list with the single
            # slot above, so a rotation can add the new key here and roll the
            # fleet at leisure instead of swapping one value everywhere at once.
            # `optional: true`: absent outside a window.
            - name: E2B_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEYS
                  optional: true
            # C3 Task 2 (N49 / controller ruling D5). Explicit, never `auto`:
            # the shipped shape must not silently fall back to a mode that
            # cannot verify a claim. A node-scoped request whose claim does not
            # resolve to a pod address is refused (503), and the address the
            # control plane dials back is the pod's -- never `body["address"]`.
            # N49 step ① (2026-10-03): per-node credentials are now shipped --
            # the map `{"<key>": "<node_id>"}` that `secrets.sh` generates, one
            # credential per worker. A request presenting a bound key must claim
            # that same node (403 otherwise), so the identity comes from the
            # *credential* and the source IP becomes the second factor rather
            # than the only one. `optional: true`: without the map (an older
            # Secret, or a lane that ships none) the fleet key above is accepted
            # exactly as before, with the once-per-key warning naming the gap.
            # What this does *not* close (still N49): a compromise inside a
            # worker pod is that node's trust domain either way; the end state
            # is a pod identity (SA token / mTLS), not a shared bearer.
            - name: E2B_INTERNAL_NODE_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_NODE_KEYS
                  optional: true
            - name: E2B_NODE_ADDRESS_MODE
              value: k8s
            - name: E2B_NODE_ADDRESS_NAMESPACE
              value: sandlock
            # C3 Task 3 (D12/D13): the CP→agent half of the two channels.
            #
            # The agent is a DaemonSet, so "the agent for this node" is only
            # defined through the host: the resolver reads the worker pod's
            # `spec.nodeName` and then the agent pod **on that host** by this
            # label (hence the Role's `list`). The instruction is addressed by
            # that node name (D12), and the worker's own identity travels in the
            # body -- never the other way round.
            - name: E2B_C3_AGENT_LABEL
              value: app=c3-agent
            - name: E2B_C3_AGENT_NAMESPACE
              value: sandlock
            # D22 (Task 4 slice B): the file-operation face is its **own**
            # endpoint. Face A (this port, 49985) hands out slot identities and
            # must run as the worker's own uid 65534 (the `uid_map` owner rule,
            # §14.2.7); face B runs as uid 0 (NFS AUTH_SYS only honours root
            # for `chown`) and is the only container with the four whitelist
            # roots mounted. One address could not serve both -- the two
            # containers share the pod netns, so a second listener on 49985
            # would be `EADDRINUSE`, and routing a file op to face A would fail
            # every chown on this NAS with `EPERM`. The k8s lane derives this
            # second port from the *same* worker-pod → node → agent-pod lookup,
            # so it is still never an address the worker named.
            - name: E2B_C3_AGENT_MAINT_PORT
              value: "49986"
            # One credential for the CP→agent hop, shared with the agent's own
            # pod and **nowhere else**: no worker manifest or worker image ever
            # carries it (pinned in `tests/unit/test_c3_internal_api_shape.py`),
            # because a worker that could read it would hold the agent's
            # credential and `worker <-> agent` would exist in fact if not in
            # design.
            - name: E2B_C3_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_C3_AGENT_TOKEN
            # D16: how many CP→agent instructions may be in flight at once.
            #
            # 64, and the reasoning is bounded on both sides rather than picked
            # to taste: (a) it must be at least the largest number of slot
            # starts one control plane can have outstanding -- the autoscaler's
            # ceiling is 16 worker replicas, and the create admission cap is 100
            # (`E2B_CREATE_QUEUE_MAX`), so the semaphore must not be the first
            # thing a create waits on; (b) the agent is a **synchronous** FastAPI
            # service, so its handlers run on the anyio threadpool (default 40)
            # -- a limit above 40 buys no throughput at the agent, and a limit
            # below it would queue grants the agent could have served in
            # parallel. 64 sits above the agent's own 40 and below the CP's 100.
            # Slice B2 measures N-concurrent creates against this number (and
            # forces it to 1 to prove the queueing the limit must *not* show);
            # this is the value it revises if that measurement says so.
            - name: E2B_C3_AGENT_MAX_CONCURRENCY
              value: "64"
            - name: E2B_ENABLE_LOCAL_NODE
              value: "false"
            # ------------------------------------------------------------------
            # The worker fleet's autoscaler, hosted *by this app* since
            # 2026-09-30 (it used to be the `autoscaler` Deployment + image; see
            # `docs/k8s-deployment.md` §2 and §4.5).
            #
            # `E2B_AS_ENABLED` is the switch that did not exist before, and it
            # is why dropping this Deployment is not just "one fewer manifest":
            # exactly one control plane must reconcile the fleet, and the two
            # replicas settle that per interval through the shared claim
            # (`e2b:autoscaler:tick`), while the loop's cooldowns and its
            # in-flight drain live in `e2b:autoscaler:state` -- both in the
            # Redis above, which is what makes "one of two replicas got this
            # interval" and "a rollout restarted the loop" safe.
            #
            # `E2B_AS_INTERNAL_API_KEY` is deliberately *not* here: the loop
            # reads the fleet and asks for a drain through this app's own
            # functions (`control_plane/fleet_view.py`), so there is no second
            # caller of the internal API to give a credential to.
            # ------------------------------------------------------------------
            - name: E2B_AS_ENABLED
              value: "true"
            - name: E2B_AS_K8S_NAMESPACE
              value: sandlock
            - name: E2B_AS_K8S_DEPLOYMENT
              # The StatefulSet's *name*. There is no kind knob any more: the
              # worker has been a StatefulSet since N20 (stable pod names are
              # stable node ids), and the pre-N20 Deployment branch went on
              # 2026-09-30 with the manifest's `E2B_AS_K8S_KIND` and the Role's
              # `deployments` rules.
              value: e2b-worker
            - name: E2B_AS_MIN_REPLICAS
              # Two, like the compose stack: worker-1 and worker-2 always run. With
              # MIN=1 the autoscaler drains one of the two worker replicas as soon
              # as the fleet is idle, which is correct for an autoscaler but not the
              # shape this manifest set is verified in (and a drained node keeps
              # `draining: true` until it re-registers, so the next placement round
              # silently loses half the fleet).
              value: "2"
            - name: E2B_AS_MAX_REPLICAS
              # N13 closed 2026-09-17 (docs/k8s-deployment.md §13): two workers
              # over one shared base were verified on a real cluster -- the
              # reconciling worker protected every tree the fleet still owned
              # (`protected_elsewhere=4`) and deleted none, the replicas were
              # handed disjoint host uids, and the surviving worker's sandboxes
              # kept working across a peer restart.
              # ⚠ Precondition: the shared storage's locks must reach across
              # nodes (NFSv4; NFSv3 + `nolock` is single-node only). The uid
              # pool's flock is what makes two replicas safe together, and a
              # cluster whose locks are local can hand out the same uid twice.
              value: "16"
            # SECURITY: credentials come from the `e2b-secrets` Secret that the
            # deploy creates *before* applying this manifest set (the placeholders
            # that used to sit here are gone: a missing Secret now leaves the pod
            # in CreateContainerConfigError instead of silently arming the stack
            # with `local-key`). $(E2B_REDIS_PASSWORD) is expanded by the kubelet
            # from the variable above; redis.yaml puts the same value behind
            # --requirepass. Without auth a full-egress sandbox can read/write the
            # shared ledger.
            - name: E2B_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_REDIS_PASSWORD
            - name: E2B_REDIS_URL
              value: redis://:$(E2B_REDIS_PASSWORD)@redis:6379/0
            # SECURITY (O3 Task 1): the secret-at-rest master key. Without it
            # SecretRegistry degrades to "in-memory + plaintext on disk" and
            # writes every value in clear text under
            # /var/lib/e2b-sandboxes/_secrets/** -- the *shared* NAS volume the
            # workers mount read-write in full, so any pod root could read
            # another tenant's secret. `optional: true` is a deliberate
            # transitional shape: applying this manifest before
            # `deploy/k8s-k0s/secrets.sh` has added the keys still starts the
            # control plane (degraded, with the startup warning) instead of
            # failing with CreateContainerConfigError, so the two steps are
            # order-independent. Run `kubectl -n sandlock rollout restart
            # deploy/control-plane` once the keys are in the Secret.
            # E2B_SECRET_MASTER_KEYS carries the *previous* keys during a
            # rotation window (old records stay decryptable until every replica
            # has re-encrypted them with the primary key).
            - name: E2B_SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_SECRET_MASTER_KEY
                  optional: true
            - name: E2B_SECRET_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_SECRET_MASTER_KEYS
                  optional: true
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_GATEWAY_URL
              value: http://control-plane:3000
            - name: E2B_SHARED_WORKSPACE_ROOT
              value: /var/lib/e2b-sandboxes
            # N57 / Task 3: the *tree* root now lives on each **node's own
            # disk** (`/var/lib/e2b/workspaces`, the worker's and face B's
            # hostPath). This pod has no mount there and never touches a tree:
            # the value is named so the paths the control plane *derives* and
            # hands to a node's agent (`remove_workspace`, `chown-workspace`,
            # the materialize plan) resolve to the node's real directory.
            # `E2B_SHARED_WORKSPACE_ROOT` above stays the export root the
            # platform's own namespaces hang off (`_snapshots`, `_migrate`,
            # `_volumes`, …), and `_migrate` is the only one of them this pod
            # writes.
            - name: E2B_WORKSPACE_BASE
              value: /var/lib/e2b/workspaces
            # N57: 树**在不在共享存储上**的具名判据。重切之后
            # `E2B_SHARED_WORKSPACE_ROOT` 仍然要设着（它就是平台自己的命名空间
            # ——`_snapshots` / `_migrate` / `_volumes` / …——挂着的那个根），所以
            # `bool(shared_workspace_root)` 再也回答不了"树在哪"。这一个值同时决定
            # 迁移路上的三件事（要不要导 tar / 要不要在目标节点建树 / 源节点的树
            # 留不留），读错一个就是**静默建空树 + 源节点留一份永不回收的副本**。
            # 今天写 `1` = 与重切前逐字相同；把树搬去节点本地盘（Task 3）就是把这
            # 一个字符改成 `0`，与 `E2B_WORKSPACE_BASE` 的指向一起改。
            #
            # Task 3 已翻（2026-10-02）：`0`，与上面 `E2B_WORKSPACE_BASE` 一起
            # 指到节点本地盘。理由与代价都是量出来的
            # （`docs/create-local-first-design.md` §1.2/§2.3，两行必须一起读）：
            # 元数据负载本地快 475×（沙箱自己的 `/workspace` 就是那条路径：
            # 写 64 B 文件 0.027 ms vs 13.136 ms），大块顺序写本地反而慢 ~3.9×
            # （124.9-125.5 vs 483-493 MB/s）。产品形态是元数据密集的开发负载，
            # 所以采本地；但这不是"处处更快"，设计文档 §1.2 把两行并列写着。
            - name: E2B_TREES_SHARED
              value: "0"
            # Task 3: the in-flight bound for one tree copy. A migration moves
            # a tree **through this process** in both directions, so the cap is
            # what makes "one 1 GiB tree" stop meaning "one 2 GiB control
            # plane" (the old code read the whole body into memory:
            # `resp.content` on the way in, `read_bytes()` on the way out).
            # Over it the answer is the named refusal `tree-copy-too-large`
            # (413); `0` disables it. Default/live value is one sandbox's disk
            # quota, because a smaller cap would refuse a legitimate full
            # sandbox (`docs/create-local-first-design.md` §3.1).
            - name: E2B_TREE_COPY_MAX_BYTES
              value: "1342177280"
            - name: E2B_TREE_COPY_WINDOW_BYTES
              value: "67108864"
            # ...and the base the platform's own files live under: the runtime
            # records (`_runtime/<id>/sandbox.json`), the command logs, the
            # checkpoint images. A *sibling* of the sunk tree root and on the
            # same mount, so a sandbox walking up from its own tree reaches the
            # workspace root and never this. Unset (every deployment that
            # predates N27) it is the workspace base, i.e. the old layout
            # unchanged. The create's marker/accounting seed, `.route-b` and
            # the uid pool's own lock and markers are *not* here any more --
            # N57 / Task 4 moved them to `E2B_NODE_STATE_BASE` (below), which is
            # node-local.
            - name: E2B_STATE_BASE
              value: /var/lib/e2b-sandboxes/state
            # N57 (Task 4): the node-local base, named here **only** so the
            # control plane's root discipline agrees with the worker's about
            # `.route-b`: `_slot_document` derives a slot document's path from
            # `E2B_ROUTE_B_TMP_ROOT` and `_require_in_roots` refuses a path
            # outside `ControlPaths.roots()` -- a named node-local base gives
            # the derivation its root (the fifth one, Task 0). This pod never
            # reads or writes anything under it (the worker writes the
            # documents, this node's agent scopes them), so there is no volume
            # here and no subPath: naming a path is not mounting it.
            - name: E2B_NODE_STATE_BASE
              value: /var/lib/e2b/state
            # C3 Task 4 slice B: route B's scratch root, where each slot's
            # `policy.json` / `program.json` live. The *worker* writes those
            # documents, but the control plane is what derives the path of the
            # one the agent has to scope to that slot's uid
            # (`scope-slot-document`) -- the worker may not report a path (hard
            # rule 3 / §14.4). Unset, that op answers a named 503 and route-B
            # slots never come up; the value is the worker's own
            # `E2B_ROUTE_B_TMP_ROOT` (N57 / Task 4 puts `.route-b` under the
            # *node-local* state base, which is why the privileged helpers grew
            # that root; before Task 4 it was under the shared state base).
            - name: E2B_ROUTE_B_TMP_ROOT
              value: /var/lib/e2b/state/.route-b
            # Track Z / Z-F7 + C3 Task 4 slice B: the control plane's cache
            # directory and the workers' OCI directory are **split**, exactly
            # the way the worker splits them (``worker.yaml``: a node-local
            # cache and a shared tar directory). Two reasons, and the second is
            # why this is a control-plane-only change:
            #
            #   * the worker writes each sandbox's secret under
            #     ``<its own E2B_IMAGE_CACHE_DIR>/secrets/<id>/`` -- on a k8s
            #     node that is the *node-local* ``/var/lib/e2b-images``
            #     (hostPath) -- and ``chown-secret`` is derived by the control
            #     plane from *this* variable. The two must be spelled the same
            #     or the op targets a path that does not exist (the agent then
            #     refuses by name);
            #   * ``image_cache_dir`` also doubles as the directory
            #     ``Template.build`` exports its OCI layout tar into
            #     (``control_plane/config.py``: ``image_oci_dir or
            #     image_cache_dir``). That tar *must* stay on the shared volume,
            #     because every worker on every node resolves from it -- so the
            #     split has to be named here rather than inherited.
            #
            # The control plane never reads or writes this directory itself in
            # the separated shape (the only consumer is the `local://` lane's
            # resolver), so pointing it at the node-local path is a *naming*
            # choice for the derived secret path.
            - name: E2B_IMAGE_CACHE_DIR
              value: /var/lib/e2b-images
            # ...and the tar directory stays on the shared volume (the
            # per-image flock + atomic publish in
            # envd_service/runtime/image_resolver.py is what makes the shared
            # directory safe for two replicas, and E2B_IMAGE_CACHE_MAX_BYTES
            # bounds it -- docs/production-deployment-requirements.md §2.7).
            - name: E2B_IMAGE_OCI_DIR
              value: /var/lib/e2b-sandboxes/_images
            - name: E2B_IMAGE_CACHE_MAX_BYTES
              value: "4294967296"
            - name: E2B_IMAGE_CACHE_EVICT_MIN_AGE_S
              value: "300"
            # The resolver hands every directory and file it creates to **this**
            # uid, which is the worker's 65534: the worker writes as the owner,
            # and a sandbox uid (10000+) gets read/traverse bits only -- never
            # 0777, since a writable rootfs cache is a cross-tenant poisoning
            # vector. docs/production-deployment-requirements.md §2.7.1.
            #
            # (Until C3 Task 5 this container ran as root and the rationale read
            # "root writes through CAP_DAC_OVERRIDE"; the CP is 65534 now, so it
            # writes as the owner of what it created. The value is unchanged --
            # 65534 was and is the uid the cache must belong to.)
            - name: E2B_IMAGE_CACHE_OWNER_UID
              value: "65534"
            # ⚠ 共享工作区（RWX PVC）必须显式设 `E2B_MAX_TOTAL_DISK_MB`：
            # 它是控制面唯一的**舰队级**磁盘准入台账（Σ 活沙箱 disk_mb）——代码默认 10240，
            # 两个栈一直用的就是这个数，但藏在默认值里没人看得见。而每节点的
            # `E2B_NODE_DISK_MB` 是各记一份的预算 —— 共用一片存储时，只有这个数代表
            # 「我们这片 slice 卖出去多少」。取值看 PVC 声明多大（基线 `pvc.yaml` 是 50Gi）。
            # 不设 = 用代码默认值 10240（**不是**不限制；置 0 才是不限制）。写出来的意义是
            # 可 grep、可评审，而且拒绝时会带上 `workspaceDisk` 那个可观测的数。
            # 详见 docs/disk-quota-options.md §7 L1。
            # - name: E2B_MAX_TOTAL_DISK_MB
            #   value: "10240"   # 代码默认值；两个栈一直用的就是它
            - name: E2B_BASE_IMAGE
              # Same registry + digest pinning as the compose stack (E6.2: a
              # base image must be digest-pinned), and the same reason the redis
              # image is an ACR mirror -- Docker Hub is unreachable from the
              # deployment hosts. Digest verified against ACR 2026-09-17.
              value: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
            - name: E2B_TEMPLATE_IMAGES
              value: '{"py311": "registry.cn-shanghai.aliyuncs.com/byteplan/python:3.11-slim"}'
            - name: E2B_MAX_SANDBOXES
              value: "1000"
            # N83 phase 2 / Task 1 + ruling R17 (2026-10-07): the largest
            # values a **single** sandbox may be configured to -- the
            # per-sandbox *policy* ceiling. It lives here, on the control plane,
            # because it is a policy: the control plane writes it into every
            # node record and hands it **down** to every worker in the
            # register/heartbeat answer (`POST /internal/nodes[/{id}]/...`), and
            # the worker adopts it (`envd_service/agent.py`). The worker no
            # longer declares these keys at all.
            #
            # The trio aligns with this lane's **worker pod**, not with anything
            # on this manifest: `deploy/k8s/worker.yaml` pins
            # `resources.limits.cpu: "2"` / `memory: 2Gi`, and the worker
            # refuses a hand-down above its own container's kernel limits
            # (D5b). (This file declares no `E2B_MAX_TOTAL_CPU_PERCENT` /
            # `_MEMORY_MB` / `_PROCESSES` at all -- it runs the code defaults
            # 400/8192/2048 -- so those are *not* what 200/2048/256 follows;
            # only `E2B_MAX_TOTAL_DISK_MB` is named here, commented out.)
            #
            # Written out because the number is a decision: one sandbox may take
            # this lane's whole declared budget, and a deployment that disagrees
            # lowers the trio without touching the node's own capacity. Raising
            # them means raising that pod's limits with them -- the k0s overlay
            # does both (`control-plane-capacity.patch.yaml` here,
            # `worker-capacity.patch.yaml` for the pod).
            - name: E2B_MAX_SANDBOX_CPU_PERCENT
              value: "200"
            - name: E2B_MAX_SANDBOX_MEMORY_MB
              value: "2048"
            - name: E2B_MAX_SANDBOX_PROCESSES
              value: "256"
            # Template.build talks to the buildkit sidecar below over a unix
            # socket inside the shared `buildkit-data` emptyDir -- the same
            # arrangement (and the same address) as the compose stack, which
            # mounts the builder's socket volume read-only at /run/buildkit.
            # Without it every `Template.build` fails; the k8s manifest set had
            # no builder at all until 2026-09-17.
            - name: E2B_BUILDKIT_ADDR
              value: unix:///run/buildkit/buildkitd.sock
          volumeMounts:
            # OBS-9: the shared volume is one trust domain -- every pod that
            # mounts it can write every sandbox tree (all of them run as root,
            # and this export does not squash root). The control plane is the
            # most exposed component (it serves the public API and holds the
            # internal key), so it gets the shared volume **read-only** and gets
            # its own writable areas mounted back on top as subPaths.
            #
            # Everything below is a directory the control plane actually
            # writes: template builds (`_builds`), the OCI layout tars it
            # exports for the workers (`_images/_oci`), its registries
            # (`_secrets`, `_templates`, `_snapshots`) and the volume
            # directories (`_volumes`). N27 adds the two roots the *tree* split
            # created:
            #   * `state` -- the platform's own files (runtime records, command
            #     logs, checkpoint images, the uid pool's lock). Without this
            #     mount every record write is EROFS.
            #   * `_migrate` -- the migration staging. N27 put it under the sunk
            #     tree root and N58 lifted it back to the export root, because its
            #     reader is the **target** node's agent: with the trees on
            #     node-local disk (Task 3) that node cannot see another node's
            #     tree root at all. That is also why it is a subPath of its own and
            #     not the tree root: OBS-9 measured "the control plane writing a
            #     sandbox tree is EROFS" on 2026-09-18 and that property is
            #     wanted, so the tree root itself stays read-only here.
            #
            # 为什么只到这里就够（逐条核过，见 `.superpowers/sdd/n27-task-5-report.md`
            # §13，N58 之后又复核过一遍）：控制面在 `<workspaces>` 下的写**一处都不剩**
            # —— 迁移暂存
            # （`_export_sandbox_archive` 把远端节点的 tar 落到
            # `platform_namespace_root() / "_migrate"`，即 export 根）和 `create_app` 的
            # `workspace_base.mkdir(exist_ok=True)`；后者在目录已存在时被
            # `exist_ok` 吞掉（`Path.mkdir` 对 EROFS 也走 `is_dir()` 复核那一条），
            # 而沙箱树本身只在 `node.address == "local://"` 的分支里被写过，
            # 本清单 `E2B_ENABLE_LOCAL_NODE=false`。真要在这种部署里开本地节点，
            # 写树会 EROFS 并在日志里响 —— 那时再谈要不要放宽。
            #
            # ⚠ 上线顺序（N27/N58 都是一次迁移）：**worker 先缩到 0 → 跑迁移脚本 →
            # 再 apply 这份清单**。绝不能在迁移之前 apply：这两个 subPath 的源
            # （`state/`、`_migrate/`）还不存在（`_migrate` 今天在
            # `workspaces/_migrate/`，是 N58 把它搬上来的），pod 会停在
            # ContainerCreating；而 worker 换了 base 之后旧位置的树与新位置对不上。
            # The directories are pre-created by the worker's
            # `workspace-root-init` (a pod that needs a subPath source that does
            # not exist yet stays in ContainerCreating and the kubelet retries,
            # so a fresh install converges once a worker has initialised).
            - name: shared
              mountPath: /var/lib/e2b-sandboxes
              readOnly: true
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_builds
              subPath: _builds
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_images
              subPath: _images
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_secrets
              subPath: _secrets
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_templates
              subPath: _templates
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_snapshots
              subPath: _snapshots
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_volumes
              subPath: _volumes
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/_migrate
              subPath: _migrate
            - name: shared
              mountPath: /var/lib/e2b-sandboxes/state
              subPath: state
            - name: buildkit-data
              mountPath: /run/buildkit
              readOnly: true
        # The builder. Rootless buildkitd (uid 1000 of the image) keeps its
        # socket inside its own data directory, which is why the control plane
        # above mounts that same emptyDir read-only rather than a socket path of
        # its own.
        - name: buildkit
          image: registry.cn-shanghai.aliyuncs.com/byteplan/buildkit:rootless
          securityContext:
            # buildkit is a builder, not a sandbox: it legitimately needs the
            # whole syscall surface (mount, clone, ...). It is also irrelevant to
            # what a sandbox can do -- the *worker's* profile is the one that must
            # stay narrowed (deploy/seccomp/sandlock-worker.json).
            seccompProfile:
              type: Unconfined
            # NOT allowPrivilegeEscalation: false, however tempting: setting it
            # makes the kubelet add no_new_privs, and rootlesskit then dies with
            # `newuidmap ... failed: newuidmap: Could not set caps` because the
            # kernel ignores newuidmap's setuid bit. Same mechanism the worker's
            # manifest calls out for its file-capability brokers. The compose
            # stack's buildkit container runs with the default (allowed), so this
            # matches it.
          volumeMounts:
            - name: buildkit-data
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
        # fsGroup 1000 (pod-level, below) is what lets the rootless builder write
        # here: the emptyDir arrives root-owned, and the builder runs as uid 1000.
        - name: buildkit-data
          emptyDir: {}
        - name: buildkit-config
          configMap:
            name: buildkitd-config
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sandlock
spec:
  selector:
    app: control-plane
  ports:
    - port: 3000
---
# A drain (node maintenance, k0s upgrade) evicts pods one at a time and has no
# idea that these two replicas are each other's fallback. Without this a single
# `kubectl drain` can take both, and the API goes down although nothing failed:
# `docs/k8s-deployment.md` §10.3 F5 has the same shape for the workers.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-plane
  namespace: sandlock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: control-plane
---
# C3 Task 2/3 (N49 / controller rulings D5, D12, D13): the control plane's
# identity source *and* its route to the node agent.
#
# The internal API binds a caller to a node by resolving that node's expected
# address, and in this shape (`E2B_NODE_ADDRESS_MODE=k8s`) the resolver reads
# `pods/<node_id>` -- `node_id` *is* the StatefulSet pod name -- with this pod's
# ServiceAccount. `get` on pods in this namespace is the whole requirement, so
# it is a namespaced Role (not a ClusterRole) and nothing else is granted.
# Without it the resolver answers "cannot determine" and every node-scoped
# request is refused (fail closed, named) -- which is the intended failure
# shape, not a silent fallback to the caller's word.
#
# C3 Task 3 (D12/D13) adds `list`: the agent's address is found in two hops --
# the worker pod's `spec.nodeName`, then the **agent pod on that host** by label
# (`E2B_C3_AGENT_LABEL`, see `deploy/k8s/c3-agent.yaml`). The second hop is a
# label-scoped `list`; `get` alone can only answer the first. Both verbs stay on
# pods in this namespace, which is all the resolver ever reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: sandlock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  # Not just a pod reader since 2026-09-30: this app hosts the worker fleet's
  # autoscaler (it used to be the `autoscaler` Deployment, whose Role carried
  # exactly the two rules below), so the scale verbs have to live here now.
  name: control-plane-pod-reader
  namespace: sandlock
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # `get`/`list` are the C3 node-address resolver's (it reads each node's
    # pod); `patch`/`delete` are the autoscaler's (`remove_node` raises one
    # pod's pod-deletion-cost before scaling the workload down, so the
    # controller terminates *that* pod rather than an arbitrary one). No
    # `watch`, no `create`: the loop reads on demand and never creates a pod.
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: ["apps"]
    # The worker's kind, and only it: a StatefulSet (stable pod names = stable
    # node ids, N20). The `deployments` pair went with `E2B_AS_K8S_KIND`
    # (2026-09-30, open-issues N52) -- a missing `statefulsets/scale` is a hard
    # 403, not a silent no-op, so this list is the whole grant.
    resources:
      - statefulsets
      - statefulsets/scale
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-pod-reader
  namespace: sandlock
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: sandlock
roleRef:
  kind: Role
  name: control-plane-pod-reader
  apiGroup: rbac.authorization.k8s.io
