# 基线的清单集合（ACK/托管集群形态：kubelet 根在 /var/lib/kubelet）。
#
# 自建 k0s 集群请用平级目录的 overlay：deploy/k8s-k0s/（它引用本目录，并改掉
# seccomp 根路径、补上共享存储 PV）。
#
# 单独 apply 某个文件（`kubectl apply -f deploy/k8s/redis.yaml`）仍然可用；
# 只是不要用 `kubectl apply -f deploy/k8s/`（目录形式会把本文件当资源解析失败）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # The namespace-wide ingress denial and its three named exceptions. First
  # because it is the floor every other policy is an exception to.
  - default-deny.yaml
  - pvc.yaml
  - redis.yaml
  - buildkit.yaml
  - control-plane.yaml
  - gateway.yaml
  - seccomp-installer.yaml
  # C3 (Task 3): the per-node agent -- the only component that grants a slot its
  # identity, and since C3 Task 7 the **only** privileged node component at all
  # (C1's `e2b-priv-broker` DaemonSet used to sit here; it is retired). It lives
  # in the baseline, not in an overlay, because nothing about it is a
  # distribution or storage difference: its one PVC claim is the base
  # `sandbox-shared`, and its node-local cache is the same `/var/lib/e2b-images`
  # hostPath the worker already uses.
  - c3-agent.yaml
  - worker.yaml
