# 基线的清单集合（ACK/托管集群形态：kubelet 根在 /var/lib/kubelet）。
#
# 自建 k0s 集群请用平级目录的 overlay：deploy/k8s-k0s/（它引用本目录，并改掉
# seccomp 根路径、补上共享存储 PV）。
#
# 单独 apply 某个文件（`kubectl apply -f deploy/k8s/redis.yaml`）仍然可用；
# 只是不要用 `kubectl apply -f deploy/k8s/`（目录形式会把本文件当资源解析失败）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - redis.yaml
  - buildkit.yaml
  - control-plane.yaml
  - gateway.yaml
  - seccomp-installer.yaml
  # C1: the per-node root broker (socket + the two owner inits). It lives in the
  # baseline, not in an overlay, because it has nothing to do with the
  # distribution or the storage *type*: `chown`/`rm`/`walk` on this baseline's
  # own shared PVC need root on a local disk too (`deploy/k8s/priv-broker.yaml`
  # has the measurement). Wherever `worker.yaml` ships the socket switch, this
  # file has to ship the broker that serves it -- `test_..._inseparable` renders
  # exactly that.
  - priv-broker.yaml
  # C3 (Task 3): the per-node agent -- the only component that grants a slot its
  # identity. It lives in the baseline with the broker for the same reason the
  # broker does (nothing about it is a distribution or storage difference), and
  # the k0s overlay inherits it unchanged: its one PVC claim is the base
  # `sandbox-shared`, and its node-local cache is the same `/var/lib/e2b-images`
  # hostPath the worker and the broker already share.
  - c3-agent.yaml
  - worker.yaml
  - autoscaler.yaml
