apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler
  namespace: sandlock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaler
  namespace: sandlock
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler
  namespace: sandlock
subjects:
  - kind: ServiceAccount
    name: autoscaler
    namespace: sandlock
roleRef:
  kind: Role
  name: autoscaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaler
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      serviceAccountName: autoscaler
      containers:
        - name: autoscaler
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-autoscaler:0.1.0
          env:
            - name: E2B_AS_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_AS_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEY
            - name: E2B_AS_BACKEND
              value: k8s
            - name: E2B_AS_K8S_NAMESPACE
              value: sandlock
            - name: E2B_AS_K8S_DEPLOYMENT
              value: e2b-worker
            - name: E2B_AS_MIN_REPLICAS
              value: "1"
            - name: E2B_AS_MAX_REPLICAS
              # N13: the multi-replica shape has never been verified -- one
              # shared RWX base means every worker reconciles and GCs a tree set
              # it does not own (the uid allocator itself is cross-process safe,
              # but per-pod reconcile authority over that base is not
              # established). Raise this only after N13 is closed on a real
              # cluster, and with the per-pod workspace layout that goes with
              # it. See docs/k8s-deployment.md §5/§8 and docs/task-backlog.md.
              value: "1"
