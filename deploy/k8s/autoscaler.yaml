apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler
  namespace: sandlock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaler
  namespace: sandlock
rules:
  - apiGroups: ["apps"]
    # Both kinds: the baseline deploys the worker as a StatefulSet (stable pod
    # names = stable node ids, N20), and `E2B_AS_K8S_KIND` selects which one is
    # scaled. A cluster on the older Deployment manifests only needs the first
    # pair, but keeping both here means the kind is a single value to change --
    # and a missing `statefulsets/scale` is a hard 403, not a silent no-op.
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler
  namespace: sandlock
subjects:
  - kind: ServiceAccount
    name: autoscaler
    namespace: sandlock
roleRef:
  kind: Role
  name: autoscaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
  namespace: sandlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaler
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      serviceAccountName: autoscaler
      containers:
        - name: autoscaler
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-autoscaler:0.1.0
          env:
            - name: E2B_AS_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_AS_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-secrets
                  key: E2B_INTERNAL_API_KEY
            - name: E2B_AS_BACKEND
              value: k8s
            - name: E2B_AS_K8S_NAMESPACE
              value: sandlock
            - name: E2B_AS_K8S_DEPLOYMENT
              # The object's *name*; the kind is the next variable. (The name is
              # historical: it scales whichever workload `E2B_AS_K8S_KIND` names.)
              value: e2b-worker
            - name: E2B_AS_K8S_KIND
              # The worker runs as a StatefulSet so its node ids survive restarts
              # (N20): a Deployment gives every restart a new pod name, and the
              # control plane then cannot route to the records the previous
              # incarnation left behind. Keep this in step with worker.yaml.
              value: statefulset
            - name: E2B_AS_MIN_REPLICAS
              # Two, like the compose stack: worker-1 and worker-2 always run. With
              # MIN=1 the autoscaler drains one of the two worker replicas as soon
              # as the fleet is idle, which is correct for an autoscaler but not the
              # shape this manifest set is verified in (and a drained node keeps
              # `draining: true` until it re-registers, so the next placement round
              # silently loses half the fleet).
              value: "2"
            - name: E2B_AS_MAX_REPLICAS
              # N13 closed 2026-09-17 (docs/k8s-deployment.md §13): two workers
              # over one shared base were verified on a real cluster -- the
              # reconciling worker protected every tree the fleet still owned
              # (`protected_elsewhere=4`) and deleted none, the replicas were
              # handed disjoint host uids, and the surviving worker's sandboxes
              # kept working across a peer restart.
              # ⚠ Precondition: the shared storage's locks must reach across
              # nodes (NFSv4; NFSv3 + `nolock` is single-node only). The uid
              # pool's flock is what makes two replicas safe together, and a
              # cluster whose locks are local can hand out the same uid twice.
              value: "16"
