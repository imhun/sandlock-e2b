apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sandlock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock:worker
          command: ["python", "-m", "envd_service.gateway_main"]
          ports:
            - containerPort: 49983
          env:
            - name: E2B_CONTROL_PLANE_URL
              value: http://control-plane:3000
            - name: E2B_INTERNAL_API_KEY
              value: "internal-key"
            - name: E2B_GATEWAY_PORT
              value: "49983"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sandlock
spec:
  selector:
    app: gateway
  ports:
    - port: 49983
