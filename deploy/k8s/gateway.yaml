# The envd gateway now runs inside the control-plane pods (merged image
# e2b-sandlock-control-plane-gateway, single port :3000). This Service keeps
# the `gateway` DNS/ingress contract: port 49983 forwards to the pods' :3000.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sandlock
spec:
  selector:
    app: control-plane
  ports:
    - port: 49983
      targetPort: 3000
