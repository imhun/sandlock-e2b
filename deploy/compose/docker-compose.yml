services:
  # Z-F7 C1: control plane (root) and worker (65534) share this cache, so it is
  # created once with the worker's ownership -- never world-writable (a
  # writable rootfs cache lets a sandbox poison another sandbox's image) -- and
  # the ownership is *verified*, so an init that cannot chown (NFS root_squash)
  # fails loudly instead of leaving a root-owned cache that makes every image
  # resolve fail later. See docs/production-deployment-requirements.md §2.7.1.
  image-cache-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.envd
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        set -e
        for dir in $$CACHE_DIRS; do
          mkdir -p "$$dir/_oci"
          chmod 0755 "$$dir" "$$dir/_oci" 2>/dev/null || true
          chown -R 65534:65534 "$$dir" 2>/dev/null ||
          echo "image-cache-init: chown refused ($$dir, NFS root_squash?) -- verifying the owner instead"
          owner="$$(stat -c %u "$$dir")"
          if [ "$$owner" != "65534" ]; then
            echo "image-cache-init: FATAL: $$dir is owned by uid $$owner, not the worker uid 65534: a 65534 worker cannot create its lock files or staging trees there, so every image resolve would fail" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown -R 65534:65534 $$dir" >&2
            exit 1
          fi
          echo "image-cache-init: $$dir is owned by uid 65534"
        done
    environment:
      CACHE_DIRS: /var/lib/e2b-sandboxes/_images
    volumes:
      - sandbox-data:/var/lib/e2b-sandboxes
    restart: "no"

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    depends_on:
      image-cache-init:
        condition: service_completed_successfully
    environment:
      E2B_API_KEYS: local-key
      E2B_ENABLE_LOCAL_NODE: "false"
      # Secret at-rest encryption (E5.4); unset = degraded with a warning.
      E2B_SECRET_MASTER_KEY: ${E2B_SECRET_MASTER_KEY:-}
      E2B_SECRET_MASTER_KEYS: ${E2B_SECRET_MASTER_KEYS:-}
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      # Extracted rootfs cache lives on the workspace volume so it survives
      # `up -d` and is shared instead of re-pulled per recreate.
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      # Bounded by the resolver itself (`_images` is in the volume's unlimited
      # project) and owned by the worker uid, which is the only way both the
      # root-run control plane and the 65534 worker can write it without making
      # the cache world-writable. See
      # docs/production-deployment-requirements.md §2.7.
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      E2B_MAX_SANDBOXES: 100
      E2B_BASE_IMAGE: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
      E2B_TEMPLATE_IMAGES: '{"python3.14": "python:3.14-slim", "node22": "node:22-slim"}'
      # Per-sandbox default memory 1024 MiB (FUP3, 2026-09-06).
      E2B_DEFAULT_MEMORY_MB: 1024
      E2B_DEFAULT_CPU_PERCENT: 100
      E2B_DEFAULT_DISK_MB: 1024
      # Whole-box semantics (M4 D6): max_processes is the per-sandbox
      # instance budget shared by every command and the MCP gateway, so the
      # default is 256 (fork's whole-box default), not the pre-M4 per-command
      # 64. Node capacity math: E2B_MAX_TOTAL_PROCESSES / 256.
      E2B_DEFAULT_MAX_PROCESSES: 256
      E2B_MAX_TOTAL_MEMORY_MB: 8192
      E2B_MAX_TOTAL_CPU_PERCENT: 400
      E2B_MAX_TOTAL_DISK_MB: 10240
      E2B_MAX_TOTAL_PROCESSES: 2048
    ports:
      - "3000:3000"
    volumes:
      - sandbox-data:/var/lib/e2b-sandboxes

  envd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.envd
    depends_on:
      image-cache-init:
        condition: service_completed_successfully
    # E5.1: worker/supervisor runs as uid 65534 (sandlock non-root shape);
    # the image pre-creates /var/lib/e2b-sandboxes owned by 65534 and the
    # named volume inherits that ownership on first creation.
    user: "65534:65534"
    environment:
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      # N16 default flip (2026-09-27): the pure shape's root is the synthesized
      # skeleton by default, and this stack is a *pure* stack (it sets no
      # `E2B_BASE_IMAGE`). Building that skeleton needs the mount family in the
      # sandbox's own user namespace -- `unshare` included, which Docker's own
      # default profile (the one this container runs under: there is no
      # `seccomp=` override here) does not admit. Name the retreat lever so the
      # minimal example keeps working; to run the new default instead, install
      # deploy/seccomp/sandlock-worker.json on this service and delete this key.
      E2B_PURE_ROOTFS: ${E2B_PURE_ROOTFS:-off}
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      # N45: the same per-sandbox pid namespace the fleet runs (the rest of
      # this file stays the minimal single-machine example: no control-plane
      # wiring, no node budget, no netns pair). Without it a sandbox here
      # shares the worker's pid namespace, so `kill(pid, 0)` answers EPERM for
      # the worker's live PID 1 -- an existence oracle. `Sandbox::pid_ns`
      # needs no partner switch (the fork builds its own user namespace), and
      # the escape hatch on a host without unprivileged user namespaces is
      # `E2B_PID_NS=false`. The file-capability/no-USerns builds that
      # development is meant to tolerate are the reason the key is spelled out
      # here instead of relying on the image default (`false`).
      E2B_PID_NS: ${E2B_PID_NS:-true}
      # C3 Task 4 slice B / ruling D23: **this shape has no privileged
      # file-operation capability, and says so.** Until the worker image lost
      # its file-capability binaries (Task 4 slice B) this example relied on
      # them through the file-capability transport; Task 4 slice B removed the
      # binaries and N52 (2026-09-30) retired the knobs themselves, so the
      # declaration is now the *absence* of any privileged-file-op key. This is
      # what the single-machine example is: the in-process (E5.1) shape, no
      # per-sandbox host uid, no route-B -- a dev/eval shape, like `local://`,
      # and **excluded from C3's coverage by name** (the coverage list in
      # `docs/superpowers/plans/2026-09-28-c3-privilege-consolidation.md` and
      # `docs/c3-privilege-relocation.md` §11.1 item 4 name it).
    ports:
      - "49983:49983"
    volumes:
      - sandbox-data:/var/lib/e2b-sandboxes
    # A6: no SYS_ADMIN (shared-volume bind deleted in A4; quota on this dev
    # stack is the local direct path, which a uid-65534 worker cannot use --
    # it degrades with a warning; use E2B_QUOTA_AGENT_URL + quota-agent for
    # real per-sandbox limits).
    privileged: false

volumes:
  sandbox-data:
