# Local auto-scaling deployment: control plane with embedded envd gateway
# (one service, one port 3000: API + gateway routing share it) + autoscaler
# that grows/retires a Docker worker pool (no static worker services).
#
# The autoscaler runs on the Docker host and uses the docker CLI to manage
# worker containers; the workers themselves need no Docker socket.
#
#   cp deploy/compose/.env.example deploy/compose/.env
#   docker compose -f deploy/compose/docker-compose.autoscale.yml up -d --build
services:
  # Z-F7 C1: the autoscaler spawns 65534 workers onto the same
  # ``sandbox-shared`` volume this root-run control plane writes template tars
  # into, so create the cache with the worker's ownership before either side
  # writes (never 0777 -- a writable rootfs cache lets a sandbox poison another
  # sandbox's image) and verify it, so a refused chown (NFS root_squash) fails
  # here instead of silently breaking every image resolve later. See
  # docs/production-deployment-requirements.md §2.7.1.
  image-cache-init:
    image: ${WORKER_IMAGE:-registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        set -e
        for dir in $$CACHE_DIRS; do
          mkdir -p "$$dir/_oci"
          chmod 0755 "$$dir" "$$dir/_oci" 2>/dev/null || true
          chown -R 65534:65534 "$$dir" 2>/dev/null ||
          echo "image-cache-init: chown refused ($$dir, NFS root_squash?) -- verifying the owner instead"
          owner="$$(stat -c %u "$$dir")"
          if [ "$$owner" != "65534" ]; then
            echo "image-cache-init: FATAL: $$dir is owned by uid $$owner, not the worker uid 65534: a 65534 worker cannot create its lock files or staging trees there, so every image resolve would fail" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown -R 65534:65534 $$dir" >&2
            exit 1
          fi
          echo "image-cache-init: $$dir is owned by uid 65534"
        done
    environment:
      CACHE_DIRS: /var/lib/e2b-sandboxes/_images
    volumes:
      - sandbox-shared:/var/lib/e2b-sandboxes
    restart: "no"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane-gateway
    image: ${CONTROL_PLANE_IMAGE:-registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-control-plane-gateway:0.1.0}
    depends_on:
      # The root-run control plane exports template tars into `_images/_oci/`
      # and must not create the directory root-owned before the init chowns it.
      image-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      E2B_API_KEYS: ${E2B_API_KEYS:-local-key}
      E2B_INTERNAL_API_KEY: ${E2B_INTERNAL_API_KEY:-internal-key}
      # Secret at-rest encryption + Redis persistence (E5.4).
      E2B_SECRET_MASTER_KEY: ${E2B_SECRET_MASTER_KEY:-}
      E2B_SECRET_MASTER_KEYS: ${E2B_SECRET_MASTER_KEYS:-}
      E2B_ENABLE_LOCAL_NODE: "false"
      E2B_REDIS_URL: redis://redis:6379/0
      # Embedded gateway: route lookups and invalidation stay in-process.
      E2B_CONTROL_PLANE_URL: http://control-plane:3000
      E2B_GATEWAY_URL: http://control-plane:3000
      E2B_SHARED_WORKSPACE_ROOT: /var/lib/e2b-sandboxes
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      # Bounded by the resolver itself (`_images` sits in the volume's
      # unlimited project) and owned by the worker uid, so both the root-run
      # control plane and the spawned 65534 workers can write it without a
      # world-writable cache. See
      # docs/production-deployment-requirements.md §2.7.
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      E2B_BASE_IMAGE: ${E2B_BASE_IMAGE:-python:3.14-slim}
      E2B_MAX_SANDBOXES: ${E2B_MAX_SANDBOXES:-1000}
      # Dynamic pools: the autoscaler governs fleet capacity, so the
      # single-host global caps are disabled (0 = unlimited).
      E2B_MAX_TOTAL_MEMORY_MB: "0"
      E2B_MAX_TOTAL_CPU_PERCENT: "0"
      E2B_MAX_TOTAL_DISK_MB: "0"
      E2B_MAX_TOTAL_PROCESSES: "0"
    ports:
      - "${CONTROL_PLANE_PORT:-3000}:3000"
    volumes:
      - sandbox-shared:/var/lib/e2b-sandboxes

  autoscaler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.autoscaler
    image: ${AUTOSCALER_IMAGE:-registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-autoscaler:0.1.0}
    depends_on:
      - control-plane
    environment:
      E2B_AS_CONTROL_PLANE_URL: http://control-plane:3000
      E2B_AS_INTERNAL_API_KEY: ${E2B_INTERNAL_API_KEY:-internal-key}
      E2B_AS_BACKEND: local
      E2B_AS_MIN_REPLICAS: ${E2B_AS_MIN_REPLICAS:-1}
      E2B_AS_MAX_REPLICAS: ${E2B_AS_MAX_REPLICAS:-8}
      E2B_AS_DOCKER_IMAGE: ${WORKER_IMAGE:-registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0}
      E2B_AS_DOCKER_NETWORK: sandlock
      E2B_AS_WORKSPACE_VOLUME: sandbox-shared
      # Spawned workers get their env only from this JSON: without the cache
      # dir they would fall back to a container-local relative path and lose
      # the rootfs on every scale-in/out.
      E2B_AS_WORKER_ENV: '{"E2B_BASE_IMAGE": "${E2B_BASE_IMAGE:-python:3.14-slim}", "E2B_EXECUTOR": "${E2B_EXECUTOR:-local}", "E2B_IMAGE_CACHE_DIR": "/var/lib/e2b-sandboxes/_images", "E2B_IMAGE_CACHE_MAX_BYTES": "4294967296", "E2B_IMAGE_CACHE_EVICT_MIN_AGE_S": "300", "E2B_IMAGE_CACHE_OWNER_UID": "65534", "E2B_NODE_MEMORY_MB": "2048", "E2B_NODE_CPU_PERCENT": "200", "E2B_NODE_DISK_MB": "4096", "E2B_NODE_PROCESSES": "256"}'
      E2B_AS_POLL_S: ${E2B_AS_POLL_S:-5}
      E2B_AS_UTIL_THRESHOLD: ${E2B_AS_UTIL_THRESHOLD:-0.70}
      E2B_AS_SCALE_UP_COOLDOWN_S: ${E2B_AS_SCALE_UP_COOLDOWN_S:-60}
      E2B_AS_SCALE_DOWN_COOLDOWN_S: ${E2B_AS_SCALE_DOWN_COOLDOWN_S:-600}
      E2B_AS_SCALE_DOWN_UTIL: ${E2B_AS_SCALE_DOWN_UTIL:-0.40}
    volumes:
      # The pool manager needs the docker CLI/socket on the host; worker
      # containers themselves never mount it.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  default:
    name: sandlock

volumes:
  redis-data:
  sandbox-shared:
    name: sandbox-shared
