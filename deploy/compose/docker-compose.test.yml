services:
  test-runner:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.test-runner
    image: e2b-sandlock-test:latest
    working_dir: /workspace
    # Non-privileged production shape. seccomp stays unconfined *here* because
    # this image runs the whole suite, including the loop/XFS and mount
    # dependent gates -- the deployed worker itself uses
    # deploy/seccomp/sandlock-worker.json (Docker's default profile plus
    # `pidfd_getfd` and `unshare`; see deploy/seccomp/README.md). NET_ADMIN is
    # for the wildcard local-origin fixture, host network for registry/Redis
    # localhost ports.
    security_opt:
      - seccomp=unconfined
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      # This runner is unfiltered on purpose (`seccomp=unconfined` above); the
      # worker's own startup self-check would otherwise refuse to serve.
      E2B_REQUIRE_SECCOMP_FILTER: "0"
      # N45: the in-container suite builds its sandboxes under the fleet's
      # per-sandbox pid namespace (the key is the only shape switch this file
      # declares; the netns pair and the image shape are selected by the runner
      # image and the suite's own fixtures -- `deploy/docker/Dockerfile.test-runner`,
      # `tests/contract/test_mcp_netns.py`). Without it the suite would run a
      # shape the fleet does not have, and the fork's pid-ns path would only be
      # covered when someone passed the variable by hand.
      E2B_PID_NS: ${E2B_PID_NS:-true}
      E2B_API_KEY: local-key
      E2B_API_URL: http://127.0.0.1:3000
      E2B_SANDBOX_URL: http://127.0.0.1:49983
      E2B_BASE_IMAGE: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
      E2B_WORKSPACE_BASE: /workspace/tmp/sandboxes
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: pytest tests/sdk/python
