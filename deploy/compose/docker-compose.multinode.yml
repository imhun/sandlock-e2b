      # 2026-09-26: all three `Restarting (1)` with `route-B scratch root
      # /tmp/sandlock-route-b is outside the privileged helper roots
      # (/var/lib/e2b-sandboxes)`).
      E2B_ROUTE_B_TMP_ROOT: /var/lib/e2b-sandboxes/.route-b
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      E2B_NODE_MEMORY_MB: 2048
      E2B_NODE_CPU_PERCENT: 200
      E2B_NODE_DISK_MB: 4096
      E2B_NODE_PROCESSES: 256
      # N36 (2026-09-26): the fleet shape, so wildcard allowOut works here.
      # Each sandbox runs its own loopback-only netns and egress goes through
      # the supervisor's connect-fd injection; the wildcard-DNS `:53` bind then
      # happens inside the sandbox's own netns (root-in-userns covers port 53),
      # which is why this file declares no low-port window. BOTH switches are
      # required: `create_app` refuses the unpaired shape by name
      # (envd_service/config.py:471-479).
      #
      # Measured 2026-09-26 on this file (uid 65534, OrbStack): the switch is
      # alignment, not a repair. The shared-netns shape it replaces never hit a
      # low-port window either -- a Docker container's netns already reads
      # `net.ipv4.ip_unprivileged_port_start=0` with no `sysctls:` declared, so
      # the wildcard `:53` bind succeeded (`docker exec <worker> cat
      # /proc/sys/net/ipv4/ip_unprivileged_port_start` = 0; forcing the window
      # shut reproduces N36's `bind DNS gateway: Permission denied (os error
      # 13)`). What wildcard rules really need here is `E2B_ENABLE_NETWORK`, and
      # this file did not declare it: without the key the policy never reaches
      # the fork, no gateway is created and the sandbox resolves against the
      # image's own resolver (N42's shape). Declaring it is an egress-posture
      # change, so it was left to its own decision; that decision landed
      # 2026-09-26 ("network on everywhere", docs/open-issues.md N42), so the
      # key now stands here with the fleet's value -- "on" still means a sandbox
      # egresses only where its own request allows it.
      E2B_ENABLE_NET_ISOLATION: "true"
      E2B_FD_INJECT_CONNECT: "true"
      # N45: the per-sandbox pid namespace, the fleet's value. Without it a
      # sandbox shares this worker's pid namespace and `kill(pid, 0)` answers
      # EPERM for the worker's live PID 1 -- an existence oracle. Independent
      # of the pair above: `Sandbox::pid_ns` makes the fork build the user
      # namespace it needs itself, so it has no partner switch and no shape
      # that takes a sandbox offline.
      E2B_PID_NS: "true"
      E2B_ENABLE_NETWORK: "true"
    volumes:
      - worker-data:/var/lib/e2b-sandboxes
    # A6: no SYS_ADMIN (shared-volume bind deleted in A4; quota via
    # E2B_QUOTA_AGENT_URL + quota-agent). The file runs the fleet shape:
    # per-sandbox netns, so wildcard allowOut rules resolve through the
    # sandbox's own DNS gateway binding 127.0.1.x:53 inside its own netns --
    # no low-port window is declared, and none is needed (as in
    # deploy/stack/docker-compose.prod.yml and deploy/compose/docker-compose.prod.yml).
    security_opt:
      # The stack's line, verbatim (deploy/stack/docker-compose.prod.yml:328):
      # Docker's default filter plus the two syscalls the sandbox-create path
      # needs (`pidfd_getfd` for the seccomp-notification fd, `unshare` for the
      # user namespace). `seccomp=unconfined` used to stand here -- this file
      # was the last place in the tree still on it -- and the worker refuses to
      # serve unfiltered by default (`envd_service/config.py::check_seccomp_filter`:
      # `Seccomp: 0` is SECCOMP_FILTER_MISSING, fatal unless
