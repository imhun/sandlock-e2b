services:
  # Z-F7 C1/tail: this shape has *two* volumes -- the control plane's
  # (`control-data`, where the root-run control plane exports template layout
  # tars into `_images/_oci/`) and the workers' (`worker-data`, where the 65534
  # workers extract rootfs entries) -- and each needs the same cache with the
  # worker's ownership. It used to have no init at all, so a volume an older
  # deployment left root-owned made every resolve fail with an error about the
  # cache directory; the same script every other shape runs now covers both,
  # and the ownership is verified (a refused chown on NFS root_squash fails
  # here, loudly, instead of silently later). Idempotent: every `up -d` runs it
  # once, and it is also the one-time `chown` an existing volume needs.
  # See docs/production-deployment-requirements.md §2.7.1.
  #
  # CACHE_DIRS paths differ from the service-side paths on purpose: what
  # matters is the ownership of the directory *inode*, which is the same
  # whatever path the same volume is mounted at in this container.
  #
  # C3 Task 5 (D24) + the compose gaps: this service is also the compose lane's
  # home for the ownership jobs the **k8s agent DaemonSet's** init containers do
  # (`deploy/k8s/c3-agent.yaml`: `storage-init` ① ② and `workspace-root-init`)
  # -- the *control-plane* pod deliberately carries **no** init container since
  # C3 Task 5 (those jobs moved to the agent's pod, the component that already
  # holds the root file face; compose has no pod, so they land in this separate
  # root one-shot). The control plane in this file now runs as **uid 65534**, so
  # every directory it writes has to *belong* to that uid before it starts --
  # the hand-over cannot be skipped, only moved:
  #
  #   * `CACHE_DIRS` -- the image caches. The cache's own directory is handed
  #     over **non-recursively** and only `_oci/` recursively, exactly as
  #     `storage-init` does it: `secrets/<sandbox_id>/<name>.secret` are live
  #     sandbox files (0600, owned by that sandbox's pooled uid), so a
  #     `chown -R` would take them back on every `up -d` and leave running
  #     sandboxes unable to read their own secrets.
  #   * `OWNED_DIRS` -- the platform's top-level namespaces that the 65534
  #     control plane (and, for `_snapshots`/`_migrate`, the 65534 worker)
  #     creates entries under. They exist on both volumes of this shape: the
  #     control plane's `control-data` and the workers' `worker-data`.
  #   * `WRITABLE_ROOTS` -- the roots a 65534 process creates top-level names
  #     in (the k8s `workspace-root-init` rule: owner 65534, or `1777`).
  #   * `VOLUME_STORES` -- the volume store, D24's target. One `chown` of the
  #     store itself **and nothing else**: the directories below it are sandbox
  #     volume data owned by pooled uids, plus the quota slices, and a
  #     recursive form would take them back on every platform rollout. Each
  #     target is verified, refuses by name (FATAL + the exact one-time
  #     command) when the hand-over is refused, and says which of the three
  #     things happened -- the same words, one path at a time, as the k8s
  #     `storage-init`'s `hand_over`.
  image-cache-init:
    image: ${WORKER_IMAGE:-registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:0.1.0}
    user: "0:0"
    # Same capability parity as the k8s sibling (`c3-agent.yaml`'s
    # `storage-init`): root with `drop: [ALL]` + exactly the three verbs this
    # script uses. The three are *measured*, not copied by analogy (round-1
    # review, and §13.6's ④ note): `CHOWN` is the hand-over itself;
    # `DAC_OVERRIDE` is `mkdir -p "<dir>/_oci"` / `mkdir -p "<owned dir>"` on
    # the idempotent re-run (EACCES with only CHOWN+FOWNER); `FOWNER` is
    # `chmod`/`chown` on a directory this process does not own. Without the drop
    # this container carried the runtime's default 14-capability set (it is the
    # one place in the stack that still did).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        set -e
        # 1. the image caches (Z-F7 C1), in the careful form `storage-init` uses.
        for dir in $$CACHE_DIRS; do
          mkdir -p "$$dir/_oci"
          chmod 0755 "$$dir" "$$dir/_oci" 2>/dev/null || true
          chown 65534:65534 "$$dir" 2>/dev/null ||
          echo "image-cache-init: chown refused ($$dir, NFS root_squash?) -- verifying the owner instead"
          chown -R 65534:65534 "$$dir/_oci" 2>/dev/null ||
          echo "image-cache-init: chown refused ($$dir/_oci, NFS root_squash?) -- verifying the owner instead"
          if [ -d "$$dir/secrets" ]; then
            chown 65534:65534 "$$dir/secrets" 2>/dev/null ||
            echo "image-cache-init: chown refused ($$dir/secrets, NFS root_squash?) -- the per-sandbox secret dirs must belong to uid 65534"
            find "$$dir/secrets" -mindepth 1 -maxdepth 2 -type d -exec chown 65534:65534 {} + 2>/dev/null ||
            echo "image-cache-init: chown refused ($$dir/secrets -mindepth 1 -maxdepth 2, NFS root_squash?) -- the per-sandbox secret dirs must belong to uid 65534"
            echo "image-cache-init: handed $$dir/secrets (directories only; *.secret files stay with their sandbox uid) to uid 65534"
          fi
          owner="$$(stat -c %u "$$dir")"
          if [ "$$owner" != "65534" ]; then
            echo "image-cache-init: FATAL: $$dir is owned by uid $$owner, not the worker uid 65534: a 65534 worker cannot create its lock files or staging trees there, so every image resolve would fail" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown 65534:65534 $$dir && chown -R 65534:65534 $$dir/_oci" >&2
            exit 1
          fi
          echo "image-cache-init: $$dir is owned by uid 65534"
        done
        # 2. the platform's own top-level namespaces (the k8s `workspace-root-init`
        #    list, plus the two the tree root carries once the tree root sank).
        for dir in $$OWNED_DIRS; do
          mkdir -p "$$dir"
          chmod 0755 "$$dir" 2>/dev/null || true
          chown 65534:65534 "$$dir" 2>/dev/null ||
          echo "image-cache-init: chown refused ($$dir, NFS root_squash?) -- verifying the owner instead"
          owner="$$(stat -c %u "$$dir")"
          if [ "$$owner" != "65534" ]; then
            echo "image-cache-init: FATAL: $$dir is owned by uid $$owner, not uid 65534: the control plane and the workers create <namespace>/<id> entries directly under it, so their first write would fail with EACCES" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown 65534:65534 $$dir" >&2
            exit 1
          fi
          echo "image-cache-init: $$dir is owned by uid 65534"
        done
        # 3. the roots a 65534 process creates top-level names in. Same judgement
        #    as `workspace-root-init`: owner 65534, or world-writable.
        for dir in $$WRITABLE_ROOTS; do
          owner="$$(stat -c %u "$$dir")"
          mode="$$(stat -c %a "$$dir")"
          if [ "$$owner" != "65534" ]; then
            chown 65534:65534 "$$dir" 2>/dev/null ||
            echo "image-cache-init: chown refused ($$dir, NFS root_squash?)"
            owner="$$(stat -c %u "$$dir")"
            mode="$$(stat -c %a "$$dir")"
          fi
          world_writable=0
          case "$$mode" in *2|*3|*6|*7) world_writable=1 ;; esac
          if [ "$$owner" != "65534" ] && [ "$$world_writable" != "1" ]; then
            chmod 1777 "$$dir" 2>/dev/null ||
            echo "image-cache-init: chmod refused ($$dir, NFS root_squash?)"
            owner="$$(stat -c %u "$$dir")"
            mode="$$(stat -c %a "$$dir")"
            world_writable=0
            case "$$mode" in *2|*3|*6|*7) world_writable=1 ;; esac
          fi
          if [ "$$owner" != "65534" ] && [ "$$world_writable" != "1" ]; then
            echo "image-cache-init: FATAL: $$dir is mode $$mode, owned by uid $$owner -- uid 65534 cannot create the top-level names it owns there, so every Sandbox.create() would fail with EACCES" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chmod 1777 $$dir  (or chown 65534:65534 $$dir)" >&2
            exit 1
          fi
          echo "image-cache-init: $$dir is writable by uid 65534 (owner=$$owner mode=$$mode)"
        done
        # 4. the volume store (D24). `hand_over` moves one directory's owner and
        #    nothing else, and **verifies what it moved**: a target that is not
        #    65534 after the attempt is a FATAL for *that* target (the caller
        #    exits 1). `_meta` is created lazily by the control plane, so a
        #    missing one is the one no-op.
        hand_over() {
          target="$$1"
          if [ ! -e "$$target" ]; then
            echo "image-cache-init: $$target does not exist -- nothing to hand over (the control plane creates it under its own uid when it first needs it)"
            return 0
          fi
          owner="$$(stat -c %u "$$target")"
          mode="$$(stat -c %a "$$target")"
          if [ "$$owner" = "65534" ]; then
            echo "image-cache-init: $$target already belongs to uid 65534 (mode $$mode) -- nothing to do"
            return 0
          fi
          chown 65534:65534 "$$target" 2>/dev/null ||
            echo "image-cache-init: chown refused ($$target, NFS root_squash?) -- the control plane (uid 65534) cannot create or record a volume until this is done once: chown 65534:65534 $$target" >&2
          owner="$$(stat -c %u "$$target")"
          mode="$$(stat -c %a "$$target")"
          if [ "$$owner" != "65534" ]; then
            echo "image-cache-init: FATAL: $$target is owned by uid $$owner, not the control-plane uid 65534: the control plane creates every volume as <store>/<volume_id> and writes <store>/_meta/<volume_id>.json, so the first volume create would fail with EACCES" >&2
            echo "image-cache-init: fix it once (as root on the node, or on the NFS server): chown 65534:65534 $$target  (non-recursive: the volume data directories below it belong to pooled sandbox uids)" >&2
            return 1
          fi
          echo "image-cache-init: $$target -> uid $$owner mode $$mode (a non-recursive hand-over; the sandbox volume data directories below it keep their pooled uids)"
          return 0
        }
        for store in $$VOLUME_STORES; do
          if [ ! -e "$$store" ]; then
            mkdir -p "$$store"
            echo "image-cache-init: created $$store (the platform's volume store)"
          fi
          hand_over "$$store" || exit 1
          hand_over "$$store/_meta" || exit 1
          store_owner="$$(stat -c %u "$$store")"
          echo "image-cache-init: $$store is owned by uid $$store_owner (the volume data directories below it are left alone)"
        done
    environment:
      CACHE_DIRS: /cache/control/_images /cache/worker/_images
      # The control plane's namespaces (`_builds`/`_secrets`/`_templates` are
      # written by it, `_snapshots` by both it and the worker), and the two the
      # workers' tree root carries (`_snapshots`/`_migrate`).
      OWNED_DIRS: /cache/control/_builds /cache/control/_secrets /cache/control/_snapshots /cache/control/_templates /cache/control/_migrate /cache/worker/_snapshots /cache/worker/_migrate
      WRITABLE_ROOTS: /cache/control /cache/worker
      VOLUME_STORES: /cache/control/_volumes
    volumes:
      - control-data:/cache/control
      - worker-data:/cache/worker
    restart: "no"

  # C3 Task 6's record store, and the reason this stack has one at all: leg (a)
  # of the self-heal staleness gate (`control_plane/self_heal.py`) refuses to
  # sweep when the control plane's records are *process-local*. Without Redis
  # this stack had no shared record store, so every round the agent reported was
  # deferred by name and the multinode lane had **no** orphan reclamation. Same
  # service, password and URL shape as `deploy/compose/docker-compose.prod.yml`
  # and `deploy/stack/docker-compose.prod.yml`.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${E2B_REDIS_PASSWORD:-local-redis-password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${E2B_REDIS_PASSWORD:-local-redis-password}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane-gateway
    # C3 Task 5 (D24) / gap 1: the same posture the k8s control plane converged
    # to (`deploy/k8s/control-plane.yaml`: `runAsUser`/`runAsGroup` 65534, no
    # root container in the pod). 65534 is not arbitrary -- §13.6 collapses to
    # it: the platform's own directories are 65534, `.uid_pool.lock` is
    # `65534:65534 0600` (another uid cannot even open it), and the image cache
    # owner is 65534 (another uid would lock itself out of what it creates).
    # What it needs to *own* is prepared by `image-cache-init` above, which is
    # also where the D24 volume-store hand-over lives -- namely the platform's
    # top-level namespaces (`_builds`/`_secrets`/`_snapshots`/`_templates`/
    # `_volumes`), the two the tree root carries (`_migrate`, and the workers'
    # `_snapshots`) and the writable root itself. Not every path the CP writes is
    # covered by that: `state`-shaped names it creates *under* the writable root
    # (`_runtime/<id>`, `.uid_pool.lock`, `.route-b/`) are made by the CP as the
    # root's owner, which is why the root itself is part of the hand-over.
    user: "65534:65534"
    depends_on:
      image-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      E2B_API_KEYS: local-key
      E2B_INTERNAL_API_KEY: internal-key
      # C3 Task 2 (N49 / D5): a node's expected address comes from its id --
      # the compose service name (`worker-1`…), which docker's embedded DNS
      # resolves for every service on this project network. Explicit, never
      # `auto`; an unresolvable node-scoped claim is refused. Per-node
      # credentials (`E2B_INTERNAL_NODE_KEYS`) are not set here -- see
      # `docs/open-issues.md` N49 for what that leaves open.
      E2B_NODE_ADDRESS_MODE: hostname
      # C3 (Task 3, D12/D13/D14): the CP→agent half of the two channels. One
      # agent per **host**; this stack runs three workers on one host, which is
      # exactly the shape that rules out a worker-pod-name identity (D12). The
      # token lives here and on the agent, never on a worker.
      E2B_C3_AGENT_URL: ${E2B_C3_AGENT_URL:-http://c3-agent:49985}
      E2B_C3_AGENT_TOKEN: ${E2B_C3_AGENT_TOKEN:-c3-agent-token}
      # D22 (Task 4 slice B): the file-operation face is its own service
      # (`c3-agent-maint`, below). Face A grants slot identities as uid 65534;
      # face B runs the file verbs as root and is the only one with the four
      # roots mounted. `grant-slot` keeps the face-A URL.
      E2B_C3_AGENT_MAINT_URL: ${E2B_C3_AGENT_MAINT_URL:-http://c3-agent-maint:49986}
      # D16: see `deploy/k8s/control-plane.yaml` / `control_plane/config.py`
      # for the reasoning behind 64; slice B2 measures it on this stack.
      E2B_C3_AGENT_MAX_CONCURRENCY: ${E2B_C3_AGENT_MAX_CONCURRENCY:-64}
      # C3 Task 6: the shared record store self-heal's leg (a) requires. With it
      # set, `SandboxRegistry` keeps its records in Redis (`RedisRecordStore`),
      # the fleet view is shared, and the sweep stops deferring.
      E2B_REDIS_URL: redis://:${E2B_REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      E2B_ENABLE_LOCAL_NODE: "false"
      # Embedded gateway: route lookups and invalidation stay in-process.
      E2B_CONTROL_PLANE_URL: http://control-plane:3000
      E2B_GATEWAY_URL: http://control-plane:3000
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      # C3 (Task 4 slice B): route B's scratch root, the path the control plane
      # derives `scope-slot-document` from (the worker writes the documents but
      # may not name a path).
      E2B_ROUTE_B_TMP_ROOT: /var/lib/e2b-sandboxes/.route-b
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      # Bounded by the resolver itself (`_images` sits in the volume's
      # unlimited project) and owned by the worker uid, so both the root-run
      # control plane and the 65534 workers can write it without a
      # world-writable cache. See
      # docs/production-deployment-requirements.md §2.7.
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      # 模板构建完成后推送到镜像仓库，worker 按需从 OCI registry 直拉 rootfs。
      # 自建 HTTP 仓库需在 docker daemon 配置 insecure-registries。
      E2B_IMAGE_REGISTRY: registry.example.com/e2b
      # 私有仓库认证（控制面 push 与 worker pull 都需配置）。
      E2B_IMAGE_REGISTRY_USERNAME: ""
      E2B_IMAGE_REGISTRY_PASSWORD: ""
      E2B_MAX_SANDBOXES: 100
      E2B_BASE_IMAGE: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
      # Per-sandbox default memory 1024 MiB (FUP3, 2026-09-06).
      E2B_DEFAULT_MEMORY_MB: 1024
      E2B_DEFAULT_CPU_PERCENT: 100
      E2B_DEFAULT_DISK_MB: 1024
      # Whole-box semantics (M4 D6): max_processes is the per-sandbox
      # instance budget shared by every command and the MCP gateway, so the
      # default is 256 (fork's whole-box default), not the pre-M4 per-command
      # 64. Node capacity math: E2B_MAX_TOTAL_PROCESSES / 256.
      E2B_DEFAULT_MAX_PROCESSES: 256
      E2B_MAX_TOTAL_MEMORY_MB: 8192
      E2B_MAX_TOTAL_CPU_PERCENT: 400
      E2B_MAX_TOTAL_DISK_MB: 10240
      E2B_MAX_TOTAL_PROCESSES: 2048
    ports:
      - "3100:3000"
    volumes:
      - control-data:/var/lib/e2b-sandboxes
    # Both channels terminate here: `default` carries `worker <-> CP` (the API
    # and the gateway the three workers dial), `agent-plane` carries
    # `CP <-> agent` (see the `networks:` block at the bottom).
    networks:
      - default
      - agent-plane

  # C3 (Task 3, D14): the per-host agent, two faces (compose has no pods). One
  # agent serves all three workers below.
  #
  # face A: the identity giver. `pid: host` is the compose spelling of the
  # DaemonSet's `hostPID: true`, and both matter for the same reason: the
  # reverse lookup (container pid -> host pid) reads the *host's* `/proc`.
  c3-agent:
    image: ${AGENT_IMAGE:-e2b-sandlock-agent:0.1.0}
    pid: host
    # Same uid as the workers: the target user namespace's owner is that 65534,
    # and only its owner (with the file capabilities) may write the map.
    user: "65534:65534"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    # The k8s shape's `readOnlyRootFilesystem`; nothing in this image writes to
    # its own rootfs (docs/security-audit/c3-agent-syscall-filter-2026-10-05.md §2b).
    read_only: true
    environment:
      # D12: the agent's identity is the host, and the name here is the one the
      # control plane dials (`E2B_C3_AGENT_URL` host = the service name).
      E2B_C3_AGENT_NODE_ID: c3-agent
      E2B_C3_AGENT_TOKEN: ${E2B_C3_AGENT_TOKEN:-c3-agent-token}
      E2B_C3_AGENT_PORT: "49985"
    # `agent-plane` only (see the `networks:` block): a worker must not be able
    # to resolve or reach this face, and the control plane is the only other
    # member of that network.
    networks:
      - agent-plane
    restart: unless-stopped

  # face B: C1's file-operation face, moved (same caps, same roots). Task 4
  # slice B gives it the payload: **the same service face A runs** (one app,
  # one op table), on its **own** port (D22). It mounts the **workers'** volume
  # (`worker-data`), which is where the trees it owns live.
  c3-agent-maint:
    image: ${AGENT_IMAGE:-e2b-sandlock-agent:0.1.0}
    user: "0:0"
    # D22: the compose half of D21's option-2 route (the agent reading a
    # worker process's uid/gid from the kernel); harmless for the file verbs.
    pid: host
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # The k8s shape's `readOnlyRootFilesystem`; nothing in this image writes to
    # its own rootfs (docs/security-audit/c3-agent-syscall-filter-2026-10-05.md §2b).
    read_only: true
    environment:
      E2B_C3_AGENT_NODE_ID: c3-agent
      E2B_C3_AGENT_TOKEN: ${E2B_C3_AGENT_TOKEN:-c3-agent-token}
      E2B_C3_AGENT_PORT: "49986"
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      E2B_SHARED_VOLUME_ROOT: /var/lib/e2b-sandboxes
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      # `priv_common.c` refuses a `--uid` outside `START..+SIZE`; this stack
      # leaves the workers at the code default (10000/1000).
      E2B_UID_POOL_START: ${E2B_UID_POOL_START:-10000}
      E2B_UID_POOL_SIZE: ${E2B_UID_POOL_SIZE:-1000}
      # N83 phase 1 / Task 2：面 B 的 rw cgroupfs 视图（`/sys/fs/cgroup:/host-cgroup`
      # 在下面的 volumes 里）。委派（把 worker 容器 cgroup 子树 chown 给它）是
      # **这个**容器做的（形态 W，计划 §3.2），所以它要有一块真的 cgroupfs；
      # 挂整棵树而非收窄视图 —— 它自己解析 worker 容器路径，那条路径与 QoS 无关。
      E2B_CGROUP_MOUNT: /host-cgroup
      # C3 Task 6: the eyes, on face B (the container that mounts the shared
      # workspaces). This stack now carries the `redis` service, so its control
      # plane has a *shared* record store and the sweep's leg (a) no longer
      # defers: the scan is live here exactly as in the other two stacks, at
      # the k8s schedule (30s first scan + 120s rounds ⇒ 2–3 minutes to
      # converge a worker that crashed and never came back).
      E2B_C3_AGENT_SCAN: "on"
      E2B_CONTROL_PLANE_URL: ${E2B_CONTROL_PLANE_URL:-http://control-plane:3000}
      E2B_C3_AGENT_SCAN_INITIAL_DELAY_S: ${E2B_C3_AGENT_SCAN_INITIAL_DELAY_S:-30}
      E2B_C3_AGENT_SCAN_INTERVAL_S: ${E2B_C3_AGENT_SCAN_INTERVAL_S:-120}
      E2B_C3_AGENT_SCAN_BACKOFF_MAX_S: ${E2B_C3_AGENT_SCAN_BACKOFF_MAX_S:-600}
    volumes:
      - worker-data:/var/lib/e2b-sandboxes
      # N83 phase 1 / Task 2：面 B 的 rw cgroupfs 视图（见上面
      # `E2B_CGROUP_MOUNT`）。`type: Directory` 的 compose 等价物就是这个绑定；
      # 只挂给面 B —— 面 A 不挂。
      - /sys/fs/cgroup:/host-cgroup
    # `agent-plane` only: this is the other half of the same two-channel split.
    networks:
      - agent-plane
    restart: unless-stopped

  worker-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.envd
    depends_on:
      image-cache-init:
        condition: service_completed_successfully
    # C3 Task 4 / ruling D25: this service's **hostname is its identity** --
    # the worker reports it (the kernel's value, which the runtime sets to the
    # container id's 12-character prefix) and the agent matches it against the
    # cgroup path of the worker's own processes to learn the uid/gid the file
    # operations act as. So: **do not set `hostname:` here.** An overridden
    # hostname is not a container id, which turns every file operation that
    # needs the worker identity (including the create-path ownership hand-over)
    # into a *named* refusal on this node -- never a wrong identity.
    # `tests/unit/test_c3_agent_manifest.py` pins the absence of the key.
    # E5.1: non-root supervisor (uid 65534); upgrade.sh migrates existing
    # root-owned worker-data volumes once.
    user: "65534:65534"
    environment:
      E2B_CONTROL_PLANE_URL: http://control-plane:3000
      E2B_NODE_ADDRESS: http://worker-1:49983
      E2B_NODE_ID: worker-1
      # C3 (Task 3): slot identity comes from the `c3-agent` service above, via
      # the control plane -- this container holds no agent address or token.
      E2B_SLOT_IDENTITY: agent-grant
      # C3 (Task 4 slice B): the file steps go to the agent too; the worker
      # image no longer ships the file-capability binaries.
      E2B_PRIV_HELPER_TRANSPORT: agent
      E2B_BASE_IMAGE: registry.cn-shanghai.aliyuncs.com/byteplan/python-mcp:3.14@sha256:3675662d0f545e255c707ca67ee1b6fae556b6db9306f6c5fbfb83b51920c8f6
      E2B_INTERNAL_API_KEY: internal-key
      E2B_WORKSPACE_BASE: /var/lib/e2b-sandboxes
      # Route B's scratch root (the per-slot policy/program documents). The
      # fleet value, copied from deploy/stack/docker-compose.prod.yml:239 --
      # these workers are uid 65534 like the fleet's. The per-node agent scopes
      # those documents to the slot's uid (0440) and only touches roots the
      # deployment names (N52 retired the worker-side broker whose whitelist
      # this used to be), so a default (`/tmp/sandlock-route-b`) outside them
      # leaves the document world-readable instead of group-scoped.
      E2B_ROUTE_B_TMP_ROOT: /var/lib/e2b-sandboxes/.route-b
      E2B_IMAGE_CACHE_DIR: /var/lib/e2b-sandboxes/_images
      E2B_IMAGE_CACHE_MAX_BYTES: ${E2B_IMAGE_CACHE_MAX_BYTES:-4294967296}
      E2B_IMAGE_CACHE_EVICT_MIN_AGE_S: ${E2B_IMAGE_CACHE_EVICT_MIN_AGE_S:-300}
      E2B_IMAGE_CACHE_OWNER_UID: ${E2B_IMAGE_CACHE_OWNER_UID:-65534}
      E2B_NODE_MEMORY_MB: 2048
      E2B_NODE_CPU_PERCENT: 200
      E2B_NODE_DISK_MB: 4096
      E2B_NODE_PROCESSES: 256
      # N83 phase 1 / Task 2: the per-sandbox cgroup switch (`off` = the code
      # default, inert) and where the rw cgroupfs view lands. On this lane the
      # view is the whole Docker VM tree (`/sys/fs/cgroup:/pod-cgroup` in the
      # volumes below) -- compose has no `subPathExpr`, so the worker recognises
      # its own subtree by the **delegated** directory instead (plan §3.5).
      E2B_SANDBOX_CGROUP: ${E2B_SANDBOX_CGROUP:-off}
      E2B_CGROUP_MOUNT: ${E2B_CGROUP_MOUNT:-/pod-cgroup}
      # N36 (2026-09-26): the fleet shape, so wildcard allowOut works here.
      # Each sandbox runs its own loopback-only netns and egress goes through
      # the supervisor's connect-fd injection; the wildcard-DNS `:53` bind then
      # happens inside the sandbox's own netns (root-in-userns covers port 53),
      # which is why this file declares no low-port window. BOTH switches are
      # required: `create_app` refuses the unpaired shape by name
      # (envd_service/config.py:471-479).
      #
      # Measured 2026-09-26 on this file (uid 65534, OrbStack): the switch is
      # alignment, not a repair. The shared-netns shape it replaces never hit a
      # low-port window either -- a Docker container's netns already reads
      # `net.ipv4.ip_unprivileged_port_start=0` with no `sysctls:` declared, so
      # the wildcard `:53` bind succeeded (`docker exec <worker> cat
      # /proc/sys/net/ipv4/ip_unprivileged_port_start` = 0; forcing the window
      # shut reproduces N36's `bind DNS gateway: Permission denied (os error
      # 13)`). What wildcard rules really need here is `E2B_ENABLE_NETWORK`, and
      # this file did not declare it: without the key the policy never reaches
      # the fork, no gateway is created and the sandbox resolves against the
      # image's own resolver (N42's shape). Declaring it is an egress-posture
      # change, so it was left to its own decision; that decision landed
      # 2026-09-26 ("network on everywhere", docs/open-issues.md N42), so the
      # key now stands here with the fleet's value -- "on" still means a sandbox
      # egresses only where its own request allows it.
      E2B_ENABLE_NET_ISOLATION: "true"
      E2B_FD_INJECT_CONNECT: "true"
      # N45: the per-sandbox pid namespace, the fleet's value. Without it a
      # sandbox shares this worker's pid namespace and `kill(pid, 0)` answers
      # EPERM for the worker's live PID 1 -- an existence oracle. Independent
      # of the pair above: `Sandbox::pid_ns` makes the fork build the user
      # namespace it needs itself, so it has no partner switch and no shape
      # that takes a sandbox offline.
      E2B_PID_NS: "true"
      E2B_ENABLE_NETWORK: "true"
    volumes:
      - worker-data:/var/lib/e2b-sandboxes
      # N83 phase 1 / Task 2: the rw cgroupfs view the worker writes the
      # per-sandbox cgroup through (plan §3.5). There is no `subPathExpr` here,
      # so this is the whole Docker VM tree; the worker picks its own subtree by
      # the directory face B delegated to it.
      - /sys/fs/cgroup:/pod-cgroup
    # A6: no SYS_ADMIN (shared-volume bind deleted in A4; quota via
    # E2B_QUOTA_AGENT_URL + quota-agent). The file runs the fleet shape:
    # per-sandbox netns, so wildcard allowOut rules resolve through the
    # sandbox's own DNS gateway binding 127.0.1.x:53 inside its own netns --
    # no low-port window is declared, and none is needed (as in
    # deploy/stack/docker-compose.prod.yml and deploy/compose/docker-compose.prod.yml).
    security_opt:
      # The stack's line, verbatim (deploy/stack/docker-compose.prod.yml:328):
      # Docker's default filter plus the two syscalls the sandbox-create path
      # needs (`pidfd_getfd` for the seccomp-notification fd, `unshare` for the
      # user namespace). `seccomp=unconfined` used to stand here -- this file
