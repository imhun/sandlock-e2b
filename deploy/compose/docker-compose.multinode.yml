volumes:
  control-data:
  worker-data:
  redis-data:

# C3 (hard rule 5: "只有两条通道"). k8s spells this as the NetworkPolicy in
# `deploy/k8s/c3-agent.yaml` -- ingress to the agent only from the
# `app=control-plane` pod, on 49985/49986. Compose has **no** policy layer, so
# the same property is carried by the network topology instead:
#
#   * `default` (this project's network) is the `worker <-> CP` channel: the
#     control plane, the three workers, redis and the init that prepares the
#     volumes are all on it, because a worker must keep reaching the control
#     plane's API/gateway.
#   * `agent-plane` is the `CP <-> agent` channel, and **nothing but the two
#     agent faces and the control plane is on it**. The agent's two service
#     names therefore do not resolve for a worker (docker's embedded DNS is
#     per network) and there is no route to their addresses either -- a worker
#     cannot reach the agent port even knowing its IP.
#
# The control plane is deliberately on both: it serves `worker <-> CP` on
# `default` and dials the agent on `agent-plane`. `internal: true` closes the
# third direction the k8s Egress rule closes -- the agent's only outbound is
# the self-heal report back to `http://control-plane:3000`, which is reachable
# on this network, so no external egress (and no DNS beyond the embedded
# resolver) is needed.
networks:
  default:
  agent-plane:
    internal: true
