# k0s（自建集群）上的差异层。
#
# 与 deploy/k8s/ 的基线相比只有两类差异，都是「发行版/环境事实」而不是策略差异：
#   1. seccomp 安装器写哪个目录 —— kubelet 把 Localhost profile 解析到
#      <它的 --root-dir>/seccomp；kubeadm/托管集群是 /var/lib/kubelet，k0s 是
#      /var/lib/k0s/kubelet。基线用的是前者。
#   2. 共享存储 —— 基线只声明一个 RWX PVC，不自带 PV（生产是 NFS/CephFS 由运营提供）；
#      这里用阿里云 NAS 的静态 NFS PV 落实它。
#
# 用法（先 kubectl -n sandlock create secret，见 README）：
#   kubectl kustomize deploy/k8s-k0s | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandlock

resources:
  # 基线清单集（deploy/k8s/kustomization.yaml）：control-plane / c3-agent /
  # worker / autoscaler / redis / seccomp-installer / buildkit。
  # （C1 的 root broker DaemonSet 曾在这里，C3 Task 7 已随整个 socket 形态退役。）
  - ../k8s
  - storage-nas.yaml
  - gateway-nodeport.yaml   # 集群外的固定入口（基线由 SLB/ingress 承担，这里没有）

patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: seccomp-installer
      namespace: sandlock
    path: seccomp-root.patch.yaml
  # C1 (wave 2): no more `worker-root.patch.yaml`. The worker pod no longer runs
  # as root (the image's USER 65534:65534 is the shape again), and the
  # privileged hand-over moved off this pod entirely -- since C3 Task 7 it is
  # `../k8s/c3-agent.yaml`'s face B (the baseline, because nothing about it is a
  # distribution difference; C1's root broker DaemonSet is retired).
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: e2b-worker
      namespace: sandlock
    path: worker-capacity.patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: control-plane
      namespace: sandlock
    path: control-plane-nfs.patch.yaml
  # N83 phase 2 / ruling R17: the per-sandbox ceiling the control plane hands
  # down lives on the control plane now, so the overlay raises it here -- with
  # the same three numbers `worker-capacity.patch.yaml` gives the worker's pod
  # limits (the worker refuses a hand-down above its own kernel read, D5b).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: control-plane
      namespace: sandlock
    path: control-plane-capacity.patch.yaml
