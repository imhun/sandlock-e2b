# k0s（自建集群）上的差异层。
#
# 与 deploy/k8s/ 的基线相比只有两类差异，都是「发行版/环境事实」而不是策略差异：
#   1. seccomp 安装器写哪个目录 —— kubelet 把 Localhost profile 解析到
#      <它的 --root-dir>/seccomp；kubeadm/托管集群是 /var/lib/kubelet，k0s 是
#      /var/lib/k0s/kubelet。基线用的是前者。
#   2. 共享存储 —— 基线只声明一个 RWX PVC，不自带 PV（生产是 NFS/CephFS 由运营提供）；
#      这里用阿里云 NAS 的静态 NFS PV 落实它。
#
# 用法（先 kubectl -n sandlock create secret，见 README）：
#   kubectl kustomize deploy/k8s-k0s | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandlock

resources:
  # 基线清单集（deploy/k8s/kustomization.yaml）。C1 的 root broker DaemonSet
  # 也在里面：它对发行版/存储类型无差别，不能只在这个 overlay 里存在。
  - ../k8s
  - storage-nas.yaml
  - gateway-nodeport.yaml   # 集群外的固定入口（基线由 SLB/ingress 承担，这里没有）

patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: seccomp-installer
      namespace: sandlock
    path: seccomp-root.patch.yaml
  # C1 (wave 2): no more `worker-root.patch.yaml`. The worker pod no longer runs
  # as root (the image's USER 65534:65534 is the shape again), and the
  # privileged hand-over moved into the root broker DaemonSet -- which lives in
  # the *baseline* (`../k8s/priv-broker.yaml`), not here: it is not a
  # distribution difference, and this overlay must not be the only path that
  # obtains one (a baseline-only apply would otherwise gate on a socket nobody
  # serves).
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: e2b-worker
      namespace: sandlock
    path: worker-capacity.patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: control-plane
      namespace: sandlock
    path: control-plane-nfs.patch.yaml
