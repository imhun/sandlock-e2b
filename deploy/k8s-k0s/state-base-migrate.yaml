# N27 Task 6 —— 一次性 state-base 迁移的 Job。
#
# 由 `deploy/scripts/migrate-state-base.sh` 渲染（把下面三处占位符填掉）后 apply：
#
#     kubectl -n sandlock create configmap state-base-migrate \
#         --from-file=migrate-state-base.sh=deploy/scripts/migrate-state-base.sh \
#         --dry-run=client -o yaml | kubectl -n sandlock apply -f -
#     deploy/scripts/migrate-state-base.sh --apply        # 就是这两条 + 等 + 收日志 + 清理
#
# 为什么是 Job：这是一次同挂载 `rename(2)`，跑完就该消失；而它必须
# **runAsUser: 0** —— 这台 NFS 只认凭据里的 uid（把树让给池里的 uid 只有 root 能做，
# 那条实测见 docs/production-deployment-requirements.md §5.4(b)；C1 之后 root 的
# 特权动作收在每节点的特权组件里 —— C3 Task 7 起是 agent 的面 B，被它取代的
# `e2b-priv-broker` DaemonSet 已退役），而且迁移留在卷上的那份回退 journal 是 0600 root 的，
# 回退那一次也要 root 才读得回来。
#
# ⚠ 三处占位符是有意的 fail-closed：
#   * `__WORKER_REPLICAS__` —— worker 是否真的停写由操作脚本**观测**（
#     `statefulset/e2b-worker` 的 spec.replicas + 没有 worker pod），不在这里猜；
#     直接 apply 原文件，引擎会因为拿到的不是 `0` 而拒绝。
#   * `__ENGINE_FLAGS__` —— 直接 apply 原文件时 `args` 是一个未知参数，脚本立刻
#     非零退出，**不会写任何东西**。
#   * `__IMAGE_VERSION__` —— 与 apply.sh 同一口径（deploy/stack/.version）。
apiVersion: batch/v1
kind: Job
metadata:
  name: state-base-migrate
  namespace: sandlock
  labels:
    app: state-base-migrate
spec:
  # 一次迁移：半途失败的容器**不**自动重试（重试会把已搬的一半再搬一遍）。
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: state-base-migrate
    spec:
      restartPolicy: Never
      # euid 0 + 保留 worker 的组：NFS 只认凭据里的 uid（rename 与 chown 都要 root），
      # 组则与 worker 的 65534 对齐，免得把文件的属组留成新东西。
      securityContext:
        runAsUser: 0
        runAsGroup: 65534
      containers:
        - name: migrate
          image: registry.cn-shanghai.aliyuncs.com/byteplan/e2b-sandlock-worker:__IMAGE_VERSION__
          command: ["bash", "/scripts/migrate-state-base.sh"]
          args: [__ENGINE_FLAGS__]
          env:
            - name: MIGRATE_ROOT
              value: /shared
            # 上面说的那道闸门：不是 "0" 就不动。
            - name: MIGRATE_WORKER_REPLICAS
              value: "__WORKER_REPLICAS__"
          volumeMounts:
            # 共享卷整卷以 **RW** 挂进来：rename 的两个端点都在这一份挂载里，
            # 这正是"秒级"的全部前提（deploy/k8s-k0s/storage-nas.yaml 的文件头）。
            - name: shared
              mountPath: /shared
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sandbox-shared
        - name: script
          configMap:
            name: state-base-migrate
            # 由 create configmap 建；只读，且不需要可执行位（命令是 `bash <path>`）。
            defaultMode: 0444
