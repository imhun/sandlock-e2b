# 节点活性窗口：300 秒 → 60 秒（2026-09-18）→ 30 秒（同日，N21 修掉之后）。
#
# 这个窗口决定「多久没心跳就当作节点没了」，而「没了」会让它名下的**活沙箱**被
# `reap_unhealthy`（E6.1）当孤儿回收、route-B 槽位被释放。所以它既是活性判据，
# 也是一条**误判就会杀活沙箱**的线，取值必须对着实测的最坏心跳空档来定。
#
# 原来设 300 秒是为了扛 N18：worker 当时在**事件循环上**解冷镜像 rootfs，阿里云 NAS
# 上实测 61 秒（本地盘 0.26 秒），本地模板更长（3 分 35 秒），这期间发不出心跳。
# 那条已经修掉（N18 (c)+(a)：OCI tar 留在共享卷、解出来的 rootfs 落到节点本地，
# 且 context 预建走 `asyncio.to_thread`），300 秒的**理由**没有了。
#
# 60 秒那一档是为了另一件事：worker 的心跳与 reconcile 轮次当时在**同一个协程**里
# （`NodeAgent._loop`：心跳 → 可能跑一轮 reconcile → sleep 5），所以空档 = 5 秒 +
# 一整轮，而轮次时长随共享 base 上的树数增长、没有上界。
# **N21 已经把这条结构性原因拆掉了**：轮次改成自己的 task（单飞），扫描与逐树校验
# 都挪到线程，心跳不再等任何一轮。
#
# 实测（`deploy/scripts/heartbeat_gaps.py`，读控制面访问日志，可复现）：
#   * 常规：两个 worker、14.7 小时、各约 1.06 万次心跳，最大空档 **5.15 秒**（中位 5.01）；
#   * 加压：把共享 base 灌到 3002 棵树（扫描实测 7.8 秒/轮）后重启 worker 与重启控制面，
#     两轮 reconcile 期间心跳仍是 **5.00 / 5.01 秒**，同一 worker 上沙箱的文件 API
#     346 次探测最差 0.30 秒。**修之前**这两种情况都会让空档变成 5 + 7.8 ≈ 12.8 秒。
#
# 30 秒的来由：6 倍实测空档，且必须**严格大于**放置窗口
# `PLACEMENT_MAX_HEARTBEAT_AGE_S`（15 秒）—— 先停止派活、再宣布节点没了，反过来会
# 把新沙箱放到一个刚被回收的节点上。这也是**不直接回 15 秒默认值**的原因：两个窗口会
# 相等，那条顺序就没了；真要回 15 秒，得连放置窗口一起下调（一条单测钉着这个顺序）。
# 另外宽窗口的代价是实的：死节点的 `reservedMemoryMB` 会挂到超时为止，两副本的舰队里
# 那等于半个集群的容量被冻住，所以能在有证据的前提下收窄就收窄。
#
# ⚠ 改这个值之前先跑一遍 deploy/scripts/heartbeat_gaps.py；它会用配置值做判据，
# 任何一次空档达到窗口就报错退出。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sandlock
spec:
  template:
    spec:
      containers:
        - name: control-plane
          env:
            - name: E2B_NODE_HEARTBEAT_TIMEOUT
              value: "30"
            # 共享工作区的磁盘**预算**（舰队级准入台账，不是水位采样）。
            #
            # 机制：`manager.py::_quota_allows_locked` 的 global "disk" 维度 ——
            # **Σ 活沙箱 disk_mb**（不是盘上字节）。它和每节点的 `E2B_NODE_DISK_MB` 回答的是
            # 两个问题：后者是"这个 worker 愿意接多少"，前者才是"我们这片 slice 一共卖出去
            # 多少"——共享一片存储时，加第三个节点不会让后者变大，这才是要紧的那个数。
            #
            # 为什么在这里显式写出来：代码默认就是 **10240**（`control_plane/config.py`），
            # 所以线上**本来就受 10 GiB 约束**（不是我先前记的"没设=不限制"）。这里把它写出来，
            # 是为了让这个数**可 grep、可评审**，而不是藏在代码默认值里。
            #
            # 取值口径：**有意只卖 PVC 声明（50 GiB）的 1/5** —— 与 compose 栈当年一致
            # （`deploy/stack/.env` = 10240）。理由是共享卷上还要留元数据、模板、镜像 tar
            # 以及别的使用者的余量；要放大就改这里，并同步想清楚"全占满时谁先失败"。
            # ⚠ 别用 `usedDiskMB/diskTotalMB` 当水位：那是**整台 NAS 文件系统**（实测 10 PiB，
            # 而我们的 PVC 只有 50 GiB 的标称），比例永远 0.005%，那盏灯永远是绿的。
            # 真实信号看 `/internal/fleet/metrics` 的 `workspaceDisk`。
            - name: E2B_MAX_TOTAL_DISK_MB
              value: "10240"
